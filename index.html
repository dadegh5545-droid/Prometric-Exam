<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>مِجهر Prometric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#F5F3F9; --surface:#FFFFFF; --surface2:#EFEBF7; --line:#DED7EE; --line2:#CBC2E2;
  --ink:#1B1626; --ink2:#5B5470; --ink3:#8C86A0;
  --violet:#4A32A8; --violet2:#6B52D0; --vsoft:#EBE5FA;
  --eosin:#C9436A; --esoft:#FBE7EE;
  --ok:#12805A; --oksoft:#DCF2E9;
  --bad:#B3312A; --badsoft:#FAE3E0;
  --warn:#A06A0B; --warnsoft:#FBEFD8;
  --shadow:0 1px 2px rgba(27,22,38,.05),0 10px 28px -16px rgba(27,22,38,.30);
  --r:14px; --rs:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131020; --surface:#1C182B; --surface2:#252036; --line:#332C48; --line2:#443A5F;
    --ink:#EDE9F7; --ink2:#ACA4C1; --ink3:#7C7595;
    --violet:#A48EF7; --violet2:#B9A8FA; --vsoft:#2A2246;
    --eosin:#EE7D9C; --esoft:#3A2029;
    --ok:#4ECB9B; --oksoft:#12332A;
    --bad:#F08579; --badsoft:#3A1F1D;
    --warn:#E0AB45; --warnsoft:#332715;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#131020; --surface:#1C182B; --surface2:#252036; --line:#332C48; --line2:#443A5F;
  --ink:#EDE9F7; --ink2:#ACA4C1; --ink3:#7C7595;
  --violet:#A48EF7; --violet2:#B9A8FA; --vsoft:#2A2246;
  --eosin:#EE7D9C; --esoft:#3A2029;
  --ok:#4ECB9B; --oksoft:#12332A;
  --bad:#F08579; --badsoft:#3A1F1D;
  --warn:#E0AB45; --warnsoft:#332715;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  direction:rtl; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0;text-wrap:balance;font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:600;line-height:1.35}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:"Reem Kufi",sans-serif;font-weight:700;font-size:19px}
.brand svg{flex:none}
.brand small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
.stain{height:3px;background:linear-gradient(90deg,var(--violet) 0%,var(--violet) 22%,var(--eosin) 22%,var(--eosin) 42%,var(--warn) 42%,var(--warn) 56%,var(--ok) 56%,var(--ok) 74%,var(--bad) 74%,var(--bad) 100%);opacity:.9}
.topsp{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface);transition:.15s}
.tbtn:hover{border-color:var(--line2);color:var(--ink)}
.timer{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;
  background:var(--vsoft);color:var(--violet);border:1px solid transparent}
.timer.low{background:var(--badsoft);color:var(--bad)}

.wrap{display:grid;grid-template-columns:216px minmax(0,1fr);gap:0;align-items:start;max-width:1240px;margin:0 auto}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:2px;padding:18px 12px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;
  font-size:14px;font-weight:500;color:var(--ink2);text-align:right;transition:.14s}
.rail button:hover{background:var(--surface2);color:var(--ink)}
.rail button.on{background:var(--violet);color:#fff;font-weight:600;box-shadow:var(--shadow)}
.rail button.on .badge{background:rgba(255,255,255,.24);color:#fff}
.rail .ico{width:18px;text-align:center;flex:none;opacity:.85}
.badge{margin-inline-start:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--ink2)}

main{padding:20px 22px 80px;min-width:0}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .rail{position:fixed;inset-inline:0;bottom:0;top:auto;flex-direction:row;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line);z-index:40;overflow-x:auto}
  .rail button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;border-radius:8px;text-align:center;min-width:60px}
  .rail button.on{box-shadow:none}
  .rail .ico{font-size:17px}
  .rail .badge{display:none}
  main{padding:16px 14px 92px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.eyebrow{font-size:12px;font-weight:700;color:var(--ink3);font-family:"IBM Plex Sans Arabic",sans-serif}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:10px;
  background:var(--violet);color:#fff;font-weight:600;font-size:14px;transition:.15s;border:1px solid transparent}
.btn:hover{background:var(--violet2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:7px 13px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--surface2);color:var(--ink2)}
.chip.v{background:var(--vsoft);color:var(--violet)}
.chip.g{background:var(--oksoft);color:var(--ok)}
.chip.r{background:var(--badsoft);color:var(--bad)}
.chip.y{background:var(--warnsoft);color:var(--warn)}
.sep{height:1px;background:var(--line);margin:4px 0}
.timer.plain{background:var(--surface2);color:var(--ink2)}
textarea{font:inherit;font-size:12px;line-height:1.5;width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);resize:vertical;direction:ltr;text-align:left}
select,input[type=number],input[type=search]{font:inherit;font-size:14px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
label.sw{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}
input[type=checkbox]{accent-color:var(--violet);width:16px;height:16px}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.kpi{background:var(--surface);padding:14px 16px}
.kpi b{display:block;font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;line-height:1.3}
.kpi span{font-size:11.5px;color:var(--ink3);font-weight:500}
.ring{--p:0;width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--violet) calc(var(--p)*1%),var(--surface2) 0)}
.ring i{width:80px;height:80px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-style:normal;font-weight:600;font-size:21px}

/* dipstick */
.strip{display:flex;flex-direction:column;gap:6px}
.dip{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:11px;cursor:pointer;
  padding:3px 4px;border-radius:8px;transition:.13s;border:none;width:100%;text-align:start;background:none;font:inherit}
.dip:hover{background:var(--surface2)}
.dip i{height:24px;border-radius:5px;border:1px solid rgba(0,0,0,.10);box-shadow:inset 0 -6px 10px -6px rgba(0,0,0,.28)}
.dip em{font-style:normal;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.dip s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3)}

/* ---------- question ---------- */
.qwrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .3s}
.stem{font-family:"IBM Plex Sans","Segoe UI",sans-serif;direction:ltr;text-align:left;
  font-size:17px;line-height:1.62;font-weight:500;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:11px;align-items:start;width:100%;
  padding:11px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);
  direction:ltr;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-size:15px;line-height:1.5;transition:.13s}
.opt:hover:not(:disabled){border-color:var(--violet);background:var(--vsoft)}
.opt .k{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--surface2);
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink2)}
.opt.pick{border-color:var(--violet);background:var(--vsoft)}
.opt.pick .k{background:var(--violet);color:#fff}
.opt.good{border-color:var(--ok);background:var(--oksoft)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:11px;padding:13px 15px;border-inline-start:3px solid var(--violet);background:var(--surface2)}
.fb.good{border-color:var(--ok);background:var(--oksoft)}
.fb.bad{border-color:var(--bad);background:var(--badsoft)}
.fb .why{direction:ltr;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-size:14px;line-height:1.6}
.fb .ar{margin-top:5px;font-size:13.5px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .22s ease-out}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* navigator */
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.nav button{height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--ink2)}
.nav button.done{background:var(--vsoft);border-color:var(--violet);color:var(--violet)}
.nav button.flag{border-color:var(--warn);color:var(--warn)}
.nav button.cur{outline:2px solid var(--violet);outline-offset:1px}
.nav button.ok{background:var(--oksoft);border-color:var(--ok);color:var(--ok)}
.nav button.no{background:var(--badsoft);border-color:var(--bad);color:var(--bad)}

/* results */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13px}
.bar u{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{height:8px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.bar i b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px}
.bar s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:end;color:var(--ink2)}

/* bank list */
.qrow{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.qrow:last-child{border-bottom:none}
.qrow .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);flex:none;padding-top:2px;width:42px}
.qrow p{direction:ltr;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-size:14px;line-height:1.55}

/* guide */
.plan{display:grid;gap:10px}
.wk{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px dashed var(--line2)}
.wk:first-child{border-top:none}
.wk b{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--violet);font-weight:600}
.tips li{margin-bottom:7px}
.tips{padding-inline-start:20px;margin:0}
.empty{text-align:center;padding:46px 20px;color:var(--ink3)}
.empty h3{color:var(--ink2);margin-bottom:6px}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res th,table.res td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
table.res th{font-size:12px;color:var(--ink3);font-weight:700}
table.res td.num{font-family:"IBM Plex Mono",monospace;text-align:end}
.scroll{overflow-x:auto}
</style>

<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="9" r="5.2" stroke="var(--violet)" stroke-width="1.7"/>
      <circle cx="12" cy="9" r="1.9" fill="var(--eosin)"/>
      <path d="M6 20h12M12 14.2V20" stroke="var(--violet)" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    مِجهر <small>MLT · QATAR</small>
  </div>
  <div class="topsp"></div>
  <div id="topslot" class="row"></div>
  <button class="tbtn" id="themeBtn" title="تبديل السمة"><span id="themeIco">◐</span></button>
</header>
<div class="stain"></div>

<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main id="view"></main>
</div>

<script>
/* ================= QUESTION BANK ================= */
const B=[];let _n=0;
function Q(s,t,o,a,e,ar){B.push({id:++_n,s:s,t:t,o:o.split("|"),a:a,e:e,ar:ar});}
/* ---- Clinical Chemistry : 150 ---- */
Q("CC","Which cardiac marker is the most specific for myocardial injury?","Cardiac troponin I|Myoglobin|LDH|AST",0,"Troponin I/T is cardiac specific, rises in 3-6 h, peaks at 12-24 h and remains elevated 7-10 days.","التروبونين نوعي للقلب ويبقى مرتفعًا 7–10 أيام");
Q("CC","Which marker rises earliest after acute myocardial infarction?","Troponin T|Myoglobin|CK-MB|LDH-1",1,"Myoglobin rises within 1-3 h but lacks cardiac specificity, so it is used mainly for early rule-out.","الميوغلوبين أسرع ارتفاعًا لكنه غير نوعي");
Q("CC","CK-MB is most useful for detecting which event?","Pericarditis|Chronic heart failure|Re-infarction after an initial MI|Stable angina",2,"CK-MB returns to baseline in 48-72 h, so a second rise indicates re-infarction while troponin is still high.","CK-MB يعود سريعًا فيكشف الاحتشاء المتكرر");
Q("CC","The anion gap is calculated as","(Cl + HCO3) - Na|K + Na - Cl|Na - Cl|Na - (Cl + HCO3)",3,"Anion gap = Na - (Cl + HCO3); reference range 8-16 mmol/L.","فجوة الأنيونات = الصوديوم ناقص (الكلور + البيكربونات)");
Q("CC","A high anion gap metabolic acidosis is typically caused by","Diabetic ketoacidosis|Hyperaldosteronism|Diarrhoea|Renal tubular acidosis",0,"Ketoacids, lactate, methanol, ethylene glycol and salicylate all add unmeasured anions.","الحماض بفجوة عالية سببه كيتونات أو لاكتات أو سموم");
Q("CC","Sodium fluoride preserves glucose because it","Chelates calcium|Inhibits enolase|Activates hexokinase|Precipitates protein",1,"Fluoride blocks enolase in the glycolytic pathway, preventing the 5-7% per hour loss of glucose.","الفلورايد يثبّط إنزيم الإينوليز فيمنع التحلّل السكري");
Q("CC","The reference method for glucose measurement uses","Biuret|Diazo|Hexokinase|Jaffe reaction",2,"Hexokinase/G6PD coupled to NADPH is the reference method; glucose oxidase is the common routine method.","الهكسوكيناز هو الطريقة المرجعية للجلوكوز");
Q("CC","HbA1c reflects mean glycaemia over the preceding","6 months|2 weeks|4 weeks|8-12 weeks",3,"HbA1c mirrors the 120-day red cell lifespan, weighted toward the most recent 8-12 weeks.","الهيموغلوبين السكري يعكس 8–12 أسبوعًا");
Q("CC","HbA1c is falsely LOW in","Haemolytic anaemia|Uraemia|Iron deficiency anaemia|Splenectomy",0,"Shortened red cell survival reduces the time available for glycation.","انحلال الدم يقصّر عمر الكرية فيخفض HbA1c كاذبًا");
Q("CC","The diagnostic fasting plasma glucose threshold for diabetes mellitus is","5.6 mmol/L|7.0 mmol/L|11.1 mmol/L|4.0 mmol/L",1,"Fasting glucose 7.0 mmol/L (126 mg/dL) or above on two occasions is diagnostic.","سكر الصيام 7.0 ملمول/ل فأكثر تشخيصي");
Q("CC","In the 2-hour OGTT, diabetes is diagnosed at a plasma glucose of","7.0 mmol/L or above|7.8 mmol/L or above|11.1 mmol/L or above|10.0 mmol/L or above",2,"A 2-hour value of 11.1 mmol/L (200 mg/dL) or above confirms diabetes; 7.8-11.0 is impaired tolerance.","بعد ساعتين 11.1 فأكثر يعني السكري");
Q("CC","The Jaffe reaction measures creatinine using","Diazotised sulfanilic acid|Bromocresol green|Copper sulfate|Alkaline picrate",3,"Creatinine and alkaline picrate form an orange-red Janovski complex measured at 505 nm.","الجافيه: كرياتينين مع البكرات القلوي");
Q("CC","A known interferent in the Jaffe creatinine method is","Bilirubin and ketones|Chloride|Water|Sodium",0,"Non-creatinine chromogens such as ketones, bilirubin, glucose and cephalosporins interfere.","الكيتونات والبيليروبين تتداخل مع الجافيه");
Q("CC","Which analyte estimates GFR independently of muscle mass?","Serum creatinine|Cystatin C|Urea|Uric acid",1,"Cystatin C is produced at a constant rate by all nucleated cells and freely filtered.","سيستاتين C لا يتأثر بالكتلة العضلية");
Q("CC","A raised urea with a normal creatinine suggests","Rhabdomyolysis|Intrinsic renal failure|Pre-renal azotaemia or GI bleeding|Post-renal obstruction",2,"Dehydration and upper GI bleeding raise urea disproportionately (urea:creatinine ratio above 20:1).","اليوريا وحدها ترتفع في الجفاف والنزف الهضمي");
Q("CC","Which protein is measured by the biuret reaction?","Globulin only|Haemoglobin|Albumin only|Total protein",3,"Cupric ions in alkali bind peptide bonds giving a violet complex proportional to total protein.","البيوريت يقيس البروتين الكلي");
Q("CC","Albumin is most commonly measured with","Bromocresol green|Biuret|Jaffe|Diazo reagent",0,"Dye-binding with bromocresol green or purple is the routine albumin method.","البروموكريزول الأخضر لقياس الألبومين");
Q("CC","Serum protein electrophoresis of nephrotic syndrome typically shows","Monoclonal spike|Low albumin with raised alpha-2|Beta-gamma bridging|Absent alpha-1",1,"Albumin and small proteins are lost while large alpha-2 macroglobulin is retained.","المتلازمة الكلائية: ألبومين منخفض وألفا2 مرتفع");
Q("CC","Beta-gamma bridging on electrophoresis is characteristic of","Acute inflammation|Multiple myeloma|Hepatic cirrhosis|Nephrotic syndrome",2,"Polyclonal IgA increase in cirrhosis fills the gap between beta and gamma zones.","تشمّع الكبد يُظهر جسر بيتا-غاما");
Q("CC","A sharp monoclonal band in the gamma region suggests","Alpha-1 antitrypsin deficiency|Iron deficiency|Chronic infection|Multiple myeloma",3,"A narrow M-spike represents a single immunoglobulin clone.","القمة أحادية النسيلة تدل على المايلوما");
Q("CC","Alpha-1 antitrypsin deficiency is associated with","Emphysema and neonatal hepatitis|Renal stones|Haemochromatosis|Gout",0,"Loss of the main protease inhibitor allows elastase damage in lung and liver.","نقص ألفا1 أنتيتربسين يسبب النفاخ الرئوي");
Q("CC","Which enzyme is most elevated in acute pancreatitis within 24 hours?","ALT|Amylase|Alkaline phosphatase|GGT",1,"Amylase rises at 2-12 h and normalises in 3-5 days; lipase stays elevated longer and is more specific.","الأميليز يرتفع باكرًا في التهاب البنكرياس");

Q("HIS","Cell block preparation from effusions is valuable because it","Allows sectioning, special stains and immunohistochemistry|Replaces the need for direct smears entirely|Requires no fixation of the collected fluid|Reduces the cost of processing the specimen",0,"Architecture is better preserved than in smears.","الكتلة الخلوية تسمح بالصبغات والكيمياء المناعية");

Q("HIS","Mesothelial cells in effusions are distinguished from adenocarcinoma by","The overall colour taken up by the cytoplasm after routine Papanicolaou staining|The absolute size of the cells measured in micrometres|Windows between cells, a two-tone cytoplasm and calretinin positivity|The nuclear diameter compared with a red blood cell",2,"Adenocarcinoma cells are typically BerEP4 and MOC-31 positive.","الخلايا المتوسطة تُظهر نوافذ وإيجابية الكالريتينين");
Q("HIS","Autolysis in tissue is prevented by","Freezing after 24 hours|Air drying|Delayed fixation|Prompt and adequate fixation",3,"Enzymatic self-digestion begins within minutes of devitalisation.","التثبيت السريع يمنع الانحلال الذاتي");
Q("HIS","Xylene is a hazardous reagent that requires","Use in a fume hood with appropriate personal protective equipment|Storage in an open container on the laboratory bench near the microtome|Disposal down the sink with plenty of running water|No special handling precautions of any kind at all",0,"It is a neurotoxic and flammable solvent.","الزايلين يُستعمل في خزانة شفط مع واقيات");
Q("HIS","Formaldehyde exposure limits require","No monitoring, as the vapour is harmless|Monitoring of air concentration and use of ventilation|An annual inspection of the ventilation only|No precautions once it has been diluted",1,"It is a recognised carcinogen with strict occupational limits.","الفورمالدهيد يستوجب تهوية ومراقبة تعرّض");
Q("HIS","Specimen identification errors in histopathology are minimised by","A single visual check performed by whoever receives the specimen in the laboratory|Batch labelling of all specimens after they are processed|Two-person verification, unique accession numbers and barcode tracking|Verbal confirmation of identity between two members of staff",2,"Misidentification is the most serious pre-analytical error.","الترقيم الفريد والباركود يمنعان الخلط");
Q("HIS","Gross description of a specimen must include","The patient full name and hospital identification number and nothing else|The time at which the surgical procedure was performed|The final histological diagnosis and nothing further|Size, weight, colour, lesions, margins and the number of blocks taken",3,"It forms a permanent legal record.","الوصف العياني يشمل الأبعاد والحواف والقوالب");
Q("HIS","Surgical margins are best identified by","Inking the specimen before sectioning|Photographs only|The surgeon note only|Memory",0,"Different coloured inks orient the specimen.","تُحبَّر الحواف قبل التقطيع لتحديدها");
/* ---- Quality, Safety, Phlebotomy and Laboratory Management ---- */
Q("MGT","Accuracy is defined as","Reproducibility of repeated results|Closeness of a result to the true value|The smallest detectable amount|The test cost",1,"Precision is reproducibility; accuracy is trueness.","الصحّة قرب النتيجة من القيمة الحقيقية");
Q("MGT","Precision is best expressed by","The range only|The mean|The coefficient of variation|The median",2,"CV = (SD/mean) x 100 and allows comparison across concentrations.","الدقة تُعبَّر عنها بمعامل الاختلاف");
Q("MGT","A Levey-Jennings chart plots","Individual patient results plotted against time|Calibrator values recorded at each calibration|Reagent lot numbers across the reporting period|Control values against run or day with mean and SD limits",3,"It makes shifts and trends visible.","مخطط ليفي-جينينغز يرسم قيم الشواهد عبر الزمن");
Q("MGT","The Westgard rule 1-3s requires the analyst to","Reject the run|Warn only|Recalibrate without action|Accept the run",0,"A single control beyond 3 SD is a rejection rule.","قاعدة 1-3s قاعدة رفض");
Q("MGT","The Westgard rule 1-2s is","A rejection rule requiring the run to be stopped|A warning rule prompting inspection of other rules|An acceptance rule confirming the run is valid|A rule no longer used in modern practice",1,"It triggers evaluation using the multirule scheme.","قاعدة 1-2s تحذيرية فقط");
Q("MGT","The 2-2s rule violation usually indicates","Random error affecting a single measurement|A specimen handling error in one tube|Systematic error requiring calibration or reagent review|No error at all, since it is within limits",2,"Two consecutive controls beyond the same 2 SD limit indicate bias.","خرق 2-2s يشير إلى خطأ منهجي");
Q("MGT","The R-4s rule detects","Carryover|Bias only|Systematic error|Random error or imprecision",3,"Controls on opposite sides spanning 4 SD indicate increased random error.","قاعدة R-4s تكشف الخطأ العشوائي");
Q("MGT","A trend on a Levey-Jennings chart most often indicates","Gradual deterioration such as reagent ageing or a failing lamp|An abrupt change such as a new reagent lot|A single sample mix-up in the analytical run|A random error with no identifiable cause",0,"Six or more points moving in one direction define a trend.","الاتجاه يعني تدهورًا تدريجيًّا");
Q("MGT","A shift on a Levey-Jennings chart most often follows","A slow gradual change over several weeks|An abrupt event such as a new reagent lot or recalibration|An isolated random error in one control|Fatigue of the operator during a long shift",1,"Ten consecutive points on one side of the mean define a shift.","الانزياح يتبع حدثًا مفاجئًا كتغيير الدفعة");
Q("MGT","Internal quality control primarily assesses","Agreement with the results of peer laboratories|Turnaround time from receipt to reporting|Day-to-day precision and detection of analytical error|The technical competency of individual staff",2,"External schemes assess accuracy against peers.","الضبط الداخلي يقيّم الدقة اليومية");
Q("MGT","External quality assessment (proficiency testing) is used to","Calibrate the analyser against a reference|Provide structured training for new staff|Replace the need for internal quality control|Compare laboratory performance against peers and reference values",3,"Participation is required for accreditation.","التقييم الخارجي يقارن الأداء بالمختبرات الأخرى");
Q("MGT","Proficiency testing samples must be","Treated exactly like patient samples by routine staff|Repeated many times|Analysed by the supervisor only|Sent to another laboratory for confirmation",0,"Referral or special handling is prohibited.","تُعامل عيّنات التقييم كعيّنات المرضى تمامًا");
Q("MGT","Total allowable error is","A value that is numerically identical to the standard deviation of the method in routine use|The combination of bias and imprecision that still permits correct clinical interpretation|The maximum acceptable reagent cost of a single test|The warranty period offered by the analyser manufacturer",1,"TEa is used to set QC rules and judge performance.","الخطأ الكلي المسموح يجمع التحيّز واللادقّة");
Q("MGT","Sigma metrics are calculated as","bias/CV|CV/TEa|(TEa - bias)/CV|TEa x CV",2,"A sigma of 6 indicates world-class performance requiring minimal QC.","مقياس سيغما = (الخطأ المسموح ناقص التحيّز) ÷ معامل الاختلاف");
Q("MGT","Youden plot analysis in external quality schemes is used to","Measure the turnaround time of each laboratory|Track the cost per test across participants|Display random error alone without bias|Compare paired sample results and reveal systematic bias",3,"Points along the 45 degree line indicate consistent bias.","مخطط يودين يكشف التحيّز المنهجي");
Q("MGT","Control material should ideally be","Commutable and analysed at clinically relevant concentrations|Analysed once a month to reduce cost|Identical in matrix to the assay calibrator|Prepared in-house from pooled patient sera",0,"Using the calibrator as control does not detect calibration error.","المادة الضابطة تُحاكي العيّنات وتُقاس بمستويات مهمة");
Q("MGT","Using the calibrator as a control is unacceptable because it","Costs more|Cannot detect calibration errors|Is unstable|Is too concentrated",1,"Independent control material is required.","المعاير لا يصلح شاهدًا لأنه لا يكشف خطأ المعايرة");
Q("MGT","When a control fails, the FIRST action is to","Release the results with an explanatory comment attached to each report issued|Adjust the assigned mean of the control material used|Stop reporting, investigate the cause and correct it before releasing results|Repeat the control once and release results regardless",2,"Patient results since the last acceptable QC must be evaluated.","عند فشل الشاهد يُوقف التبليغ ويُبحث السبب");
Q("MGT","Diagnostic sensitivity is calculated as","TN/(TN+FP)|TP/(TP+FP)|TN/(TN+FN)|TP/(TP+FN)",3,"It is the ability to correctly identify those with the disease.","الحساسية = الإيجابيات الحقيقية ÷ كل المرضى");
Q("MGT","Diagnostic specificity is calculated as","TN/(TN+FP)|TP/(TP+FP)|(TP+TN)/total|TP/(TP+FN)",0,"It is the ability to correctly identify those without disease.","النوعية = السلبيات الحقيقية ÷ كل الأصحاء");
Q("MGT","Positive predictive value depends strongly on","The analytical sensitivity of the method used|Disease prevalence in the population tested|The precision of the assay at the cut-off|The number of samples analysed each day",1,"PPV falls as prevalence falls, even for an excellent test.","القيمة التنبّؤية الإيجابية تعتمد على انتشار المرض");
Q("MGT","A screening test should ideally have","High specificity to avoid any false positives|The lowest possible cost per test performed|High sensitivity to minimise missed cases|Low sensitivity to reduce the workload",2,"Confirmatory tests then provide high specificity.","اختبار المسح يحتاج حساسية عالية");
Q("MGT","A receiver operating characteristic curve plots","The cost of testing against the time taken|The mean against the standard deviation|Analytical bias against the coefficient of variation|Sensitivity against specificity as the cut-off varies",3,"The area under the curve summarises overall discrimination.","منحنى ROC يوازن الحساسية والنوعية");
Q("MGT","In method comparison, the regression slope reflects","Proportional (constant ratio) systematic error|Constant error independent of concentration|The random imprecision of the new method|The detection limit of the comparative method",0,"The y-intercept reflects constant systematic error.","الميل يعكس الخطأ المنهجي النسبي");
Q("MGT","A Bland-Altman plot displays","The correlation coefficient between two methods|The difference between two methods against their mean|The regression slope alone without intercept|Sequential control values across many runs",1,"It shows bias and limits of agreement.","بلاند-ألتمان يعرض الفرق مقابل المتوسط");
Q("MGT","A high correlation coefficient between two methods","Confirms that the two methods are accurate|Proves the two methods agree numerically|Does not prove agreement because it is insensitive to bias|Measures the precision of the new method",2,"Bias assessment requires difference plots and regression.","معامل الارتباط العالي لا يعني توافقًا");
Q("MGT","Linearity studies determine","The lowest concentration that the assay is able to detect reliably in practice|The cost per test across the whole reportable range|The within-run precision measured at each level|The measuring range over which results are proportional to concentration",3,"Results outside the linear range require dilution.","دراسة الخطية تحدّد مدى القياس");
Q("MGT","Carryover studies assess","Contamination of one sample by the previous high sample|The technical skill of the operating staff|The stability of samples during storage|The shelf life of the reagent on board",0,"A high sample is followed by low samples to measure the effect.","دراسة الانتقال تقيس تلوّث العيّنة بسابقتها");
Q("MGT","A reference interval established by a laboratory should be verified with a minimum of about","5 subjects|20 healthy reference subjects|100 subjects|1000 subjects",1,"Full establishment requires 120 or more subjects.","التحقّق من المجال المرجعي بـ20 شخصًا سليمًا على الأقل");
Q("MGT","Reference intervals should be reviewed when","A new member of staff joins the laboratory department|The analyser is serviced by the supplier|The method, population or instrument changes|Never, once they have been established",2,"Continuity of clinical interpretation depends on it.","تُراجع المجالات عند تغيّر الطريقة أو السكان");
Q("MGT","Verification of a new method before clinical use must include","Precision studies alone, repeated over five consecutive working days in duplicate|An analysis of the cost per reportable patient result|Nothing further if the assay carries a CE mark|Precision, accuracy, reportable range and reference interval verification",3,"Documented verification is an accreditation requirement.","التحقّق يشمل الدقة والصحّة والمدى والمجال المرجعي");
Q("MGT","Calibration verification is performed","At defined intervals, after major maintenance and when QC indicates drift|Once each week regardless of analytical performance or quality control results|Only once, at the time the analyser is installed|Never, provided the controls remain within range",0,"Manufacturer instructions and regulations define the frequency.","تُتحقّق المعايرة دوريًّا وبعد الصيانة الكبرى");
Q("MGT","The pre-analytical phase accounts for approximately","5% of laboratory errors|60-70% of laboratory errors|1%|20%",1,"Collection, identification and transport dominate error statistics.","معظم أخطاء المختبر في المرحلة قبل التحليلية");
Q("MGT","The most serious pre-analytical error is","Lipaemia|Slight haemolysis|Patient or specimen misidentification|Delayed transport",2,"It can lead directly to patient harm, especially in transfusion.","الخطأ في هوية المريض هو الأخطر");
Q("MGT","Patient identification before phlebotomy requires","The room number and the bed number as recorded on the ward admission list at the time of collection|The name of the clinician who requested the investigation|A single identifier such as the patient family name|At least two independent identifiers such as full name and date of birth or medical record number",3,"Bed and room numbers are never acceptable identifiers.","التعريف بمُعرِّفَين مستقلَّين على الأقل");
Q("MGT","For an unconscious patient without identification, the laboratory should","Use the assigned unique emergency identification number consistently|The bed number allocated to the patient at the time of admission to the ward|A descriptive nickname agreed between the ward staff|Refusal to test until the identity is established",0,"The temporary number must be linked to the permanent record later.","يُستخدم رقم طوارئ فريد ثابت");
Q("MGT","The correct order of draw begins with","EDTA tube|Blood culture bottles|Serum tube|Citrate tube",1,"Sterility must be protected before any additive tube.","يبدأ ترتيب السحب بقنينة زرع الدم");
Q("MGT","In the order of draw, the citrate (light blue) tube is collected","After the EDTA tube has been completely filled and then thoroughly mixed|Before the blood culture bottles are inoculated|Immediately after blood cultures and before serum and heparin tubes|Last of all, after the fluoride oxalate tube",2,"Additive carryover would alter coagulation results.","السترات بعد زرع الدم وقبل بقية الأنابيب");
Q("MGT","In the order of draw, the EDTA tube is collected","Before the citrate tube in the sequence|Before the plain serum tube in the sequence|First of all, before blood culture bottles|After heparin tubes and before fluoride tubes",3,"EDTA carryover falsely raises potassium and lowers calcium.","EDTA بعد الهيبارين وقبل الفلورايد");
Q("MGT","The last tube in the order of draw is usually","Sodium fluoride/potassium oxalate (grey)|The citrate tube for coagulation studies|The plain serum tube for biochemistry|The EDTA tube for haematology",0,"Fluoride inhibits enzymes and would interfere with other tests.","الأنبوب الرمادي هو الأخير");
Q("MGT","A tourniquet should not remain applied for more than","10 seconds|1 minute|5 minutes|10 minutes",1,"Prolonged stasis causes haemoconcentration and falsely raises many analytes.","لا يبقى الرباط أكثر من دقيقة");
Q("MGT","The preferred venepuncture site is the","Dorsal hand veins|Basilic vein|Median cubital vein|Cephalic vein at the wrist",2,"It is well anchored and away from the brachial artery and median nerve.","الوريد المتوسط المرفقي هو المفضّل");
Q("MGT","Venepuncture should be avoided","Within the antecubital fossa of either arm|In adult patients of any age or condition|On the arm opposite a previous mastectomy|On the same side as a mastectomy, fistula or an infusion line",3,"Lymphoedema and infusion contamination compromise the sample and the patient.","يُتجنّب الذراع ذات الناسور أو استئصال الثدي");
Q("MGT","Vigorous mixing or shaking of a blood tube causes","Haemolysis|Faster clotting|No effect|Better mixing",0,"Tubes are inverted gently 5-10 times.","الرجّ العنيف يسبّب انحلالًا");
Q("MGT","The most common cause of haemolysis during collection is","Using a large gauge needle so that the blood draw remains rapid and completely unhindered|Using a small needle, excessive suction or forcing blood through the needle into a tube|Allowing the tube to fill slowly under its own vacuum|Gentle inversion of the tube immediately after filling",1,"Transferring blood through the needle should be avoided.","الإبرة الرفيعة والشفط القوي يسبّبان الانحلال");
Q("MGT","Fainting (syncope) during phlebotomy is managed by","Leaving the patient unattended in the chair while going to summon help from a colleague|Continuing the draw as quickly as possible to finish|Removing the tourniquet and needle, lowering the head and ensuring the patient is safe|Giving water by mouth while the patient is unconscious",2,"The patient must never be left unattended.","عند الإغماء تُسحب الإبرة ويُخفض الرأس");
Q("MGT","A haematoma forming during venepuncture requires","Continuing the draw and then applying ice to the site|Applying a second tourniquet above the site|Massaging the area to disperse the blood|Immediate removal of the needle and firm pressure",3,"Pressure is applied for at least 2-5 minutes.","الورم الدموي يستوجب سحب الإبرة والضغط");
Q("MGT","Nerve injury during venepuncture is suspected when the patient reports","Sharp shooting pain, tingling or numbness, requiring immediate needle removal|A sensation of warmth spreading gradually outwards from the venepuncture site|No unusual sensation beyond a feeling of mild pressure|A dull ache that resolves within a few seconds",0,"The event must be documented and reported.","الألم الكهربائي يوجب سحب الإبرة فورًا");
Q("MGT","Capillary (skin puncture) blood differs from venous blood by having","Lower glucose with higher potassium and calcium|Higher glucose and lower potassium, calcium and total protein|Values identical to those of venous blood|Higher potassium with lower total protein",1,"Composition resembles arterial blood more than venous.","دم الوخز أعلى غلوكوزًا وأقلّ بوتاسيومًا");
Q("MGT","In infants the recommended heel stick site is","The pad of the great toe of either foot|The central posterior curve of the heel|The medial or lateral plantar surface of the heel|The arch of the foot between the pads",2,"The central heel risks calcaneal bone injury.","الوخز في الحافة الوحشية أو الإنسية للعقب");
Q("MGT","The first drop of a capillary sample should be","Collected first, as it is the freshest sample|Used only for the glucose measurement|Spread directly onto a glass slide|Wiped away because it contains tissue fluid",3,"Tissue fluid dilutes the sample.","تُمسح القطرة الأولى لاحتوائها سائلًا نسيجيًّا");
Q("MGT","Excessive squeezing (milking) of a finger during capillary collection causes","Tissue fluid contamination, haemolysis and falsely low potassium and platelet counts|No measurable change at all in any of the laboratory analytes requested on that specimen|Improved accuracy because the sample is fresher|Better blood flow with no other measurable effect",0,"Gentle intermittent pressure is used instead.","العصر الشديد يلوّث العيّنة بالسائل النسيجي");
Q("MGT","Needles must be disposed of","Into the sharps container only after recapping the needle using both hands|Immediately into a puncture-resistant sharps container without recapping|Into the general clinical waste stream in a yellow bag|After bending the needle so that it cannot be reused",1,"Recapping is the leading cause of needlestick injury.","تُلقى الإبر في حاوية الحادّة دون إعادة تغطية");
Q("MGT","A sharps container should be replaced when it is","Overflowing|Completely full|About three quarters full|Half full only after a month",2,"Overfilling causes injuries during disposal.","تُستبدل الحاوية عند ثلاثة أرباع امتلائها");
Q("MGT","The first action after a needlestick injury is","Reporting immediately to the line supervisor|Squeezing the wound firmly to expel blood|Applying undiluted bleach to the puncture|Wash the site immediately with soap and running water",3,"Reporting, source evaluation and post-exposure prophylaxis follow immediately.","اغسل الموضع فورًا بالماء والصابون ثم أبلغ");
Q("MGT","Post-exposure prophylaxis for HIV is most effective when started","Within 72 hours, ideally within hours of exposure|One week after the exposure has occurred|Only after seroconversion has been confirmed|Only if symptoms of infection develop",0,"Rapid initiation markedly reduces transmission risk.","الوقاية بعد التعرّض تبدأ خلال ساعات");
Q("MGT","Hepatitis B vaccination for laboratory staff is","Entirely optional and left to the choice of the individual member of staff|Strongly recommended or mandatory, with anti-HBs titre confirmation|Required only for staff who perform phlebotomy duties|Given only after a documented exposure has occurred",1,"An anti-HBs level above 10 mIU/mL indicates protection.","تطعيم التهاب الكبد B مع التأكّد من العيار");
Q("MGT","Standard precautions require that","Hand hygiene is optional if gloves are worn|Only samples labelled as high risk are hazardous|All blood and body fluids are treated as potentially infectious|Gloves are needed only for known positives",2,"Universal application removes reliance on knowing the diagnosis.","تُعامل كل العيّنات على أنها معدية");
Q("MGT","Gloves should be changed","Only when they become visibly soiled|Every hour regardless of what is handled|Once at the beginning of each shift|Between patients and whenever contaminated or torn",3,"Hand hygiene is performed after removal.","تُبدَّل القفازات بين المرضى وعند التلوّث");
Q("MGT","Eating, drinking and applying cosmetics in the laboratory are","Prohibited in all technical areas|Allowed if careful|Allowed in the corner|Allowed at the bench",0,"They are permitted only in designated clean areas.","يُمنع الأكل والشرب في مناطق العمل");
Q("MGT","Centrifuging an unbalanced load may cause","Improved separation of plasma from cells|Rotor damage, aerosol release and mechanical failure|A faster acceleration to the set speed|No consequence provided the lid is closed",1,"Tubes must be balanced by weight and placed symmetrically.","عدم الاتزان يُتلف الطرد ويطلق الرذاذ");
Q("MGT","A centrifuge lid should be opened","At any time once the centrifuge run has finished, since the samples are safely contained within the tubes|Immediately after the power switch has been turned off|Only after the rotor has come to a complete stop, waiting 30 seconds for aerosols to settle|While the rotor is still turning slowly, to save time",2,"Aerosols are a major laboratory infection route.","لا يُفتح الغطاء قبل التوقف التام");
Q("MGT","Mouth pipetting is","Allowed with care|Allowed for non-infectious samples|Acceptable for water|Absolutely prohibited",3,"Mechanical pipetting devices must always be used.","يُمنع السحب بالفم منعًا باتًّا");
Q("MGT","A Class II biosafety cabinet must be certified","At installation, after relocation or repair, and at least annually|Once every five years by a service engineer sent by the manufacturer|Only when a performance problem has been noticed|Never, provided the airflow feels adequate to the user",0,"Airflow and HEPA integrity are verified.","تُعتمد الخزانة سنويًّا وبعد النقل والإصلاح");
Q("MGT","A chemical safety data sheet must be","Filed securely in the departmental office for occasional reference|Readily accessible to all staff for every hazardous chemical|Requested from the supplier whenever it is needed|Reviewed once a year by the management team only",1,"It lists hazards, handling, storage and first aid.","صحيفة بيانات السلامة متاحة لكل العاملين");
Q("MGT","When diluting concentrated acid the correct practice is","Heat first|Add water to acid|Add acid slowly to water with stirring|Mix equal volumes rapidly",2,"The reverse generates violent, spattering heat.","يُضاف الحمض إلى الماء لا العكس");
Q("MGT","Flammable solvents must be stored in","A domestic refrigerator situated within the main laboratory working area|Open shelving directly above the working bench|An ordinary unventilated wooden storage cupboard|An approved, vented flammable storage cabinet away from ignition sources",3,"Domestic refrigerators are a common ignition hazard.","تُخزَّن المذيبات في خزانة معتمدة للمواد القابلة للاشتعال");
Q("MGT","A fire caused by electrical equipment should be extinguished with","A carbon dioxide or dry powder extinguisher|A water jet directed at the base of the fire|A foam extinguisher smothering the flames|Dry sand poured over the equipment",0,"Water conducts electricity and increases the hazard.","حريق الكهرباء يُطفأ بثاني أكسيد الكربون أو المسحوق");
Q("MGT","The RACE acronym in fire response stands for","Run, Alert, Call, Escape|Rescue, Alarm, Contain, Extinguish or Evacuate|Report, Assess, Clean, Exit|Read, Act, Control, End",1,"PASS describes extinguisher use: pull, aim, squeeze, sweep.","RACE: إنقاذ، إنذار، احتواء، إطفاء أو إخلاء");
Q("MGT","A blood spill should be managed by","Wiping it away immediately with a dry paper towel and then washing the hands thoroughly with soap and running water afterwards|Rinsing the area with plenty of running water and drying it|Covering with absorbent material, applying 0.5% hypochlorite, then removing with gloves and disposing as clinical waste|Ignoring it altogether if the volume spilled is small",2,"Contact time of at least 10 minutes is required.","يُغطّى الانسكاب ويُطهَّر بالهيبوكلوريت");
Q("MGT","Infectious clinical waste is usually disposed of in","Ordinary black bags for landfill disposal|The laboratory sink with copious water|Clear bags for general domestic waste|Yellow or red bags for incineration or autoclaving",3,"Colour coding follows national regulations.","النفايات المعدية في أكياس صفراء أو حمراء");
Q("MGT","Cultures and stocks of microorganisms must be","Decontaminated by autoclaving or an approved method before disposal|Rinsed thoroughly with running water and then discarded directly into waste|Stored indefinitely as part of the culture collection|Discarded intact into the clinical waste bags provided",0,"Autoclave performance must be validated with indicators.","تُعقَّم المزارع قبل التخلّص منها");
Q("MGT","An eyewash station must be","Tested once each year at the time of the annual laboratory safety audit|Accessible within 10 seconds of hazard areas and flushed regularly|Kept locked so that it cannot be used accidentally|Located outside the main laboratory building entrance",1,"Flushing prevents biofilm and confirms function.","محطّة غسل العين قريبة وتُشغَّل دوريًّا");
Q("MGT","Ergonomic injury among laboratory staff is most often related to","Exposure to solvents and fixative vapours|High noise levels from analyser operation|Repetitive pipetting and prolonged microscopy posture|Prolonged work in cold storage areas",2,"Job rotation, adjustable seating and electronic pipettes reduce risk.","الإصابات المهنية من تكرار المصّ والجلوس الطويل");
Q("MGT","Laboratory results may be released to","Any person who telephones the laboratory and asks for them, provided they give a name|Family members who ask about the patient on the ward|The employer of the patient as a matter of routine|Only the authorised requesting clinician, the patient or a legally authorised person",3,"Confidentiality is a legal and ethical obligation.","النتائج تُصرف للمخوّلين قانونًا فقط");
Q("MGT","Patient confidentiality in the laboratory requires","Restricted access to records, secure passwords and discretion in all communication|Publication of fully anonymised patient results for teaching and training purposes only|Free discussion of named cases among laboratory colleagues|Discussion of named patients in corridors and lifts",0,"Breaches carry legal and professional consequences.","السرّية تستوجب حماية السجلات والحذر في الحديث");
Q("MGT","Informed consent is particularly required for","Every routine biochemistry and haematology test that is requested by any clinician at all|Tests with major personal implications such as HIV and genetic testing, per local law|No laboratory test at all under any circumstances|Only investigations performed during a surgical procedure",1,"Pre-test counselling accompanies such tests.","الموافقة المستنيرة لفحوص كالإيدز والوراثة");
Q("MGT","A laboratory information system audit trail records","The final validated result and nothing more|Reagent lot numbers used for each analysis|Who entered, modified or released each result and when|No information beyond the reporting time",2,"Amended reports must retain the original value.","سجل التدقيق يوثّق كل تعديل ومَن أجراه");
Q("MGT","When a released result is found to be wrong, the laboratory should","Wait until the next sample from that patient is received before taking any action|Take no action at all if the error appears to be minor|Delete the erroneous result quietly from the system|Issue a corrected report, retain the original and notify the clinician promptly",3,"Prompt notification limits patient harm.","يُصدَر تقرير مصحّح ويُبلَّغ الطبيب فورًا");
Q("MGT","Turnaround time is measured from","Specimen collection or receipt to result release, as defined by policy|The ordering of reagents through to their eventual delivery on the site|The start of the working shift through to its end|The release of the result through to its reporting",0,"Critical tests have defined maximum turnaround targets.","زمن الاستجابة يُقاس من السحب أو الاستلام حتى الإصدار");
Q("MGT","A specimen rejection policy should be","Informal and left entirely to the individual professional judgement of the staff|Written, with defined criteria and documented communication to the requester|Decided case by case by the duty clinical scientist|Unnecessary provided that all staff are properly trained",1,"Irretrievable specimens may be tested with a disclaimer.","سياسة الرفض مكتوبة وتُبلَّغ للجهة الطالبة");
Q("MGT","Which specimen must be rejected outright?","A gel separator tube for biochemistry|Mildly lipaemic serum from a fed patient|An unlabelled tube or one with a mismatched label|A correctly labelled fasting specimen",2,"Identification errors cannot be corrected retrospectively.","الأنبوب غير الموسوم يُرفض حتمًا");
Q("MGT","Documents in a quality management system must be","Handwritten and kept by the section head|Held as a single copy by one person|Uncontrolled so staff can amend them freely|Version controlled, authorised, dated and reviewed periodically",3,"Obsolete copies must be withdrawn from use.","الوثائق مضبوطة بالإصدار ومراجعة دوريًّا");
Q("MGT","A standard operating procedure should be reviewed","At defined intervals and whenever the method or equipment changes|Once every ten years, when a major revision of the manual is undertaken|Never again once it has been formally authorised|Only after it has been implicated in an incident",0,"Staff must be retrained on significant changes.","تُراجع الإجراءات دوريًّا وعند أي تغيير");
Q("MGT","A non-conformity in the quality system requires","Immediate disciplinary action taken against the members of staff involved|Root cause analysis, corrective action and verification of effectiveness|No action at all if the impact is judged to be minor|A verbal note passed on to the head of the section",1,"Preventive action addresses potential problems.","عدم المطابقة يستوجب تحليل الجذر وإجراءً تصحيحيًّا");
Q("MGT","An internal audit in an accredited laboratory is performed","Only by the external accreditation body at the time of assessment visits|By the laboratory director personally in every case|Periodically by trained internal staff independent of the area audited|Never, since external assessment is entirely sufficient",2,"Findings feed into management review.","التدقيق الداخلي يُجرى بموظفين مستقلّين عن القسم");
Q("MGT","The international standard specifically for medical laboratory quality and competence is","ISO 14001|ISO 27001|ISO 9001|ISO 15189",3,"It covers both management and technical requirements.","الأيزو 15189 خاص بالمختبرات الطبية");
Q("MGT","Staff competency assessment must be","Performed initially and at defined intervals with documented evidence|Assumed to persist automatically after five years of continuous service|Entirely optional for experienced clinical scientists|Carried out once only at the time of appointment",0,"Direct observation, record review and blind testing are common methods.","تُقيَّم الكفاءة أوّليًّا ودوريًّا بتوثيق");
Q("MGT","Equipment maintenance records must include","The purchase price together with the contact details of the equipment supplier|Preventive maintenance, repairs, calibration and function checks with dates|The names of the operators who use the instrument|No records beyond the original installation date",1,"Records demonstrate fitness for use.","سجلات الصيانة توثّق الوقاية والإصلاح والمعايرة");
Q("MGT","Reagents must be used","Beyond expiry if they appear satisfactory|Only during periods of emergency working|Within the expiry date and after documented lot verification|Without any verification of a new lot",2,"New lots are verified against the current lot before use.","تُستخدم الكواشف ضمن صلاحيتها بعد التحقّق من الدفعة");
Q("MGT","Refrigerator and freezer temperatures for reagents must be","Checked once a year at the safety audit|Left unmonitored if the unit has an alarm|Checked monthly and recorded in a logbook|Monitored and recorded daily with defined action limits",3,"Out-of-range events require documented action.","تُسجَّل حرارة الثلاجات يوميًّا");
Q("MGT","Water quality for the laboratory should be monitored for","Resistivity, microbial content and total organic carbon as appropriate|The taste and the odour of the water each time before it is used in the assay|The temperature of the water at the point of delivery|The colour and clarity assessed by visual inspection",0,"Poor water quality causes unexplained analytical drift.","تُراقب جودة الماء بالمقاومية والمحتوى الجرثومي");
Q("MGT","A biohazard symbol must be displayed on","Culture plates only, since nothing else in the laboratory carries any appreciable infection risk|Laboratory doors, equipment, refrigerators and transport containers holding infectious material|No item at all, since staff already know the hazards|Administrative office doors and connecting corridors",1,"It warns all who enter or handle the material.","علامة الخطر البيولوجي على الأبواب والأجهزة والحاويات");
Q("MGT","Infectious specimens transported outside the facility must use","A single robust container fitted with a secure screw cap and labelled with the name of the sender and the destination address|An ordinary padded postal envelope sent by first class post|Triple packaging with a leak-proof primary receptacle, absorbent secondary packaging and rigid outer packaging|Plain packaging carrying a written biohazard warning",2,"Category A and B substances have specific regulatory requirements.","النقل بتغليف ثلاثي وفق اللوائح");
Q("MGT","In molecular diagnostics, the workflow must be unidirectional to prevent","Sample confusion only|Equipment damage|Reagent waste|Amplicon carryover contamination",3,"Separate rooms for reagent preparation, template addition and amplification are used.","سير العمل باتجاه واحد يمنع تلوّث النواتج المضخّمة");
Q("MGT","An internal amplification control in PCR is used to detect","Inhibition and assay failure in an individual sample|The cost of reagents consumed per run|Errors made by the operator in setting up|Contamination of the reaction with amplicon",0,"Its absence signals an invalid result rather than a true negative.","الشاهد الداخلي يكشف تثبيط التفاعل");
Q("MGT","A no-template control in PCR detects","Inhibition|Reagent or environmental contamination|Sensitivity|Specificity of primers only",1,"Any amplification in the NTC invalidates the run.","شاهد بلا قالب يكشف التلوّث");
Q("MGT","The purpose of a laboratory risk assessment is to","Satisfy the documented requirements of the external accreditation auditors|Assign individual responsibility after an incident occurs|Identify hazards, evaluate risk and implement controls before harm occurs|Increase the documented workload of laboratory staff",2,"It must be documented and reviewed regularly.","تقييم المخاطر يحدّد الأخطار ويضبطها مسبقًا");
Q("MGT","The most effective single measure to prevent laboratory-acquired infection is","Prophylactic antibiotics given routinely to every exposed member of the laboratory staff|A single annual training session on laboratory safety|Vaccination of all staff without any other measures|Consistent adherence to standard precautions including hand hygiene and correct PPE",3,"Engineering controls and safe practices reinforce it.","الالتزام بالاحتياطات القياسية أفعل وقاية");

Q("CC","A 58-year-old man arrives 5 hours after the onset of crushing chest pain. Troponin I is markedly raised and CK-MB is high. Two days later the pain recurs. Which marker best confirms re-infarction?","CK-MB, which had returned toward baseline|LDH|Myoglobin measured on admission|Troponin I, which is still elevated",0,"Troponin remains high for 7-10 days and cannot distinguish a second event; CK-MB normalises by 48-72 h so a new rise is informative.","التروبونين ما يزال مرتفعًا فلا يميّز الاحتشاء الثاني");
Q("CC","A 22-year-old with type 1 diabetes is admitted drowsy. Glucose 28 mmol/L, pH 7.10, bicarbonate 8 mmol/L, urine ketones trace only. What explains the weak urine ketone result?","The patient is not in fact ketotic, and the acidosis has some other explanation entirely here|The dipstick does not detect beta-hydroxybutyrate, the dominant ketone in severe acidosis|The urine is too dilute for ketones to be detected|Ascorbic acid in the urine is interfering with the pad",1,"Measure blood beta-hydroxybutyrate; nitroprusside detects only acetoacetate and acetone.","الشريط لا يكشف بيتا هيدروكسي بيوتيرات السائد في الحماض");
Q("CC","A 60-year-old on a thiazide has sodium 118 mmol/L, serum osmolality 245 mosm/kg, urine osmolality 600 mosm/kg and is clinically euvolaemic. The most likely diagnosis is","Pseudohyponatraemia|Dehydration|Syndrome of inappropriate ADH secretion|Diabetes insipidus",2,"Concentrated urine despite low serum osmolality with euvolaemia is the classic SIADH pattern.","بول مركّز مع أسمولالية منخفضة وسواء حجم يعني SIADH");
Q("CC","A serum sample from a patient with triglycerides of 40 mmol/L reports sodium 118 mmol/L on an indirect ISE analyser, yet the patient is asymptomatic. The next step is","Repeat the same method|Report as critical|Treat the hyponatraemia|Repeat by direct ISE on whole blood",3,"Severe lipaemia causes pseudohyponatraemia only on diluted (indirect) methods.","الشحوم العالية تسبّب نقص صوديوم كاذبًا على الطريقة غير المباشرة");
Q("CC","A 35-year-old woman has calcium 2.90 mmol/L, phosphate 0.65 mmol/L and PTH at the upper limit of normal. The most likely diagnosis is","Primary hyperparathyroidism|Vitamin D deficiency|Hypoparathyroidism|Secondary hyperparathyroidism",0,"A non-suppressed PTH in the face of hypercalcaemia is inappropriate and indicates autonomy.","PTH غير مكبوت مع فرط كالسيوم يعني فرط جارات أوّليًّا");
Q("CC","A 45-year-old with fatigue has TSH 8.5 mIU/L and free T4 within the reference interval. This pattern is","Overt hypothyroidism|Subclinical hypothyroidism|Hyperthyroidism|A pituitary tumour",1,"Anti-TPO antibodies help predict progression to overt disease.","قصور درقي تحت سريري: TSH مرتفع وT4 طبيعي");
Q("CC","A patient on long-term phenytoin has a total phenytoin level below the therapeutic range but albumin of 22 g/L and clinically adequate seizure control. The best action is","Repeat the total level|Increase the dose|Measure free phenytoin|Stop the drug",2,"Hypoalbuminaemia lowers the total but not the free, pharmacologically active fraction.","نقص الألبومين يخفض المستوى الكلي لا الحر");
Q("CC","A 3-day-old term infant has total bilirubin 300 micromol/L, almost entirely unconjugated, with a positive DAT and maternal group O, infant group A. The mechanism is","Gilbert syndrome|Neonatal hepatitis|Biliary atresia|ABO haemolytic disease of the newborn",3,"Maternal IgG anti-A crosses the placenta; the disease is usually mild but can require phototherapy.","مرض ABO الانحلالي الوليدي بأضداد الأم IgG");
Q("HEM","A 30-year-old woman has Hb 9.5 g/dL, MCV 68 fL, RDW 18%, RBC 4.0 x 10^12/L and ferritin 6 microgram/L. The diagnosis is","Iron deficiency anaemia|Anaemia of chronic disease|Sideroblastic anaemia|Beta thalassaemia trait",0,"Low ferritin with a high RDW and a low red cell count fits iron deficiency; the Mentzer index of 17 also favours it.","فريتين منخفض وRDW مرتفع يعني عوز حديد");
Q("HEM","A 26-year-old has Hb 10.8 g/dL, MCV 63 fL, RBC 6.2 x 10^12/L, RDW 13% and normal ferritin. The next test is","A therapeutic trial of oral iron for three months|Haemoglobin electrophoresis or HPLC for HbA2|Bone marrow aspiration and trephine biopsy|A reticulocyte count with red cell indices",1,"A high red cell count with a normal RDW and normal iron suggests thalassaemia trait; HbA2 above 3.5% confirms beta trait.","عدد كريات مرتفع مع RDW طبيعي يوجّه للثلاسيميا");
Q("HEM","A patient on heparin for 6 days develops a platelet fall from 250 to 60 x 10^9/L and a new deep vein thrombosis. The most likely diagnosis is","Pseudothrombocytopenia|Immune thrombocytopenic purpura|Heparin-induced thrombocytopenia|Disseminated intravascular coagulation",2,"Anti-PF4/heparin antibodies cause thrombocytopenia with paradoxical thrombosis; heparin must be stopped.","نقص الصفيحات بالهيبارين مع خثار متناقض");
Q("HEM","An automated platelet count is 45 x 10^9/L but the patient has no bleeding and the film shows platelet aggregates at the feather edge. The correct action is","Transfuse platelets|Report as critical immediately|Report the low count|Repeat the count on a citrate or heparin sample",3,"EDTA-dependent pseudothrombocytopenia must be excluded before reporting.","تكتّل الصفيحات في EDTA يستوجب إعادة بأنبوب سترات");
Q("HEM","A patient with sepsis has platelets 40 x 10^9/L, PT and aPTT prolonged, fibrinogen 0.8 g/L and D-dimer markedly raised. The diagnosis is","Disseminated intravascular coagulation|Vitamin K deficiency|Liver disease alone|Haemophilia A",0,"Consumption of platelets and factors with secondary fibrinolysis defines DIC.","استهلاك العوامل والصفيحات مع D-dimer مرتفع يعني DIC");
Q("HEM","A prolonged aPTT fully corrects on 1:1 mixing with normal plasma and the patient has a lifelong history of joint bleeds. The next test is","Lupus anticoagulant assay|Factor VIII and IX assays|Platelet aggregation|D-dimer",1,"Correction on mixing indicates a factor deficiency rather than an inhibitor.","التصحيح بالخلط يوجّه لمعايرة العوامل");
Q("HEM","A 68-year-old has WBC 180 x 10^9/L with the full spectrum of granulocyte maturation, 3% blasts, basophilia and massive splenomegaly. The most likely diagnosis is","Chronic lymphocytic leukaemia|Leukaemoid reaction|Chronic myeloid leukaemia|Acute myeloid leukaemia",2,"BCR-ABL1 testing confirms it; the LAP score is characteristically low.","ابيضاض النقي المزمن مع كثرة أسسات وضخامة طحال");
Q("BB","A patient receiving red cells develops fever, loin pain and red urine after 50 mL. The FIRST laboratory action after the transfusion is stopped is","Culture the implicated unit and await the microbiology result before taking any further action at all|Issue a replacement unit and continue the transfusion|Repeat the antibody identification panel on a new sample|Perform a clerical check, inspect post-transfusion plasma for haemolysis, and repeat ABO and DAT",3,"These three steps detect most acute ABO incompatibility within minutes.","التحقّق الكتابي وفحص البلازما وكومبس أولًا");
Q("BB","A patient transfused 8 days ago has a falling haemoglobin, jaundice and a newly positive DAT with mixed-field agglutination. The most likely antibody class involved is","An anamnestic IgG alloantibody such as anti-Jka|A naturally occurring anti-A isoagglutinin|A cold reacting anti-Lewis antibody|A cold IgM autoantibody with wide thermal range",0,"Kidd antibodies fall below detection between exposures and cause delayed reactions.","تفاعل انحلالي متأخر بضدّ IgG استذكاري");
Q("BB","A group A Rh negative woman delivers a group O Rh positive infant. The Kleihauer test suggests a 45 mL fetal bleed. The RhIG dose required is","One standard 300 microgram dose|Two standard doses|No dose is needed|Half a dose",1,"Each 300 microgram dose covers 30 mL of whole blood, so a 45 mL bleed needs two.","نزف 45 مل يحتاج جرعتين من الأنتي-D");
Q("BB","During crossmatching, the patient serum is incompatible with all six units tested and the autocontrol is also positive. The most likely explanation is","Technical error only|A single alloantibody|A warm autoantibody|Anti-K",2,"Autoadsorption or differential adsorption is needed to exclude underlying alloantibodies.","ضدّ ذاتي دافئ يفسّر عدم التوافق العام");
Q("MIC","A 24-year-old woman has dysuria; urine culture grows 80,000 CFU/mL of a catalase positive, coagulase negative, novobiocin resistant gram positive coccus. The organism is","Enterococcus faecalis|Streptococcus agalactiae|Staphylococcus epidermidis|Staphylococcus saprophyticus",3,"It is a leading cause of cystitis in sexually active young women.","المكوّرة الرمّية مقاومة للنوفوبيوسين وتسبّب التهاب المثانة");
Q("MIC","A diabetic patient in ketoacidosis develops black necrotic nasal turbinates. Tissue microscopy shows broad, ribbon-like, aseptate hyphae. The diagnosis is","Mucormycosis|Candidiasis|Cryptococcosis|Aspergillosis",0,"Rhino-orbital-cerebral mucormycosis needs urgent debridement and amphotericin B.","الفطار العفني: خيوط عريضة غير مقسّمة");
Q("MIC","A ventilated patient grows an oxidase positive, non-lactose fermenting gram negative rod producing a green pigment and a grape-like odour. The organism is","Escherichia coli|Pseudomonas aeruginosa|Klebsiella pneumoniae|Acinetobacter baumannii",1,"Intrinsic resistance makes susceptibility testing essential before therapy.","الزائفة الزنجارية موجبة الأوكسيداز وخضراء الصباغ");
Q("MIC","A child with a sore throat grows beta-haemolytic colonies that are bacitracin sensitive and PYR positive. Which complication is this organism associated with?","Botulism caused by preformed neurotoxin ingested in contaminated food|Guillain-Barre syndrome following the infection|Acute rheumatic fever and post-streptococcal glomerulonephritis|Haemolytic uraemic syndrome caused by a toxin",2,"Group A streptococcal sequelae are immune mediated; ASO titres support recent infection.","العقدية المقيّحة تسبّب الحمى الرثوية والتهاب الكبيبات");
Q("MIC","Blood cultures from a patient with a prosthetic hip grow coagulase negative staphylococci in one bottle of one set only. The most appropriate interpretation is","A sterile result that requires no further investigation or repeat sampling at all|Contamination of the culture media during manufacture|Definite bacteraemia requiring immediate treatment|Probable skin contamination, but repeat cultures are needed given the prosthesis",3,"Significance depends on the number of positive sets and the clinical context.","نموّ في قنينة واحدة يوحي بالتلوّث مع ضرورة الإعادة");
Q("PAR","A traveller returning from West Africa has fever, and the thin film shows multiple ring forms per red cell with 8% parasitaemia and crescentic gametocytes. The species and severity are","Plasmodium falciparum, severe|Plasmodium malariae, mild|Plasmodium ovale, mild|Plasmodium vivax, mild",0,"High parasitaemia, multiple rings and banana gametocytes indicate severe falciparum malaria.","المنجلية الشديدة: طفيلية عالية وأمشاج موزيّة");
Q("UBF","A patient with acute renal failure has urine showing muddy brown granular casts and renal tubular epithelial cells. The most likely diagnosis is","Glomerulonephritis|Acute tubular necrosis|Cystitis|Nephrotic syndrome",1,"Red cell casts would indicate a glomerular cause instead.","القوالب الحبيبية البنية تدل على نخر نبيبي حاد");
Q("UBF","A 6-year-old has periorbital oedema, urine protein 4+, and oval fat bodies showing a Maltese cross under polarised light. The diagnosis is","Renal stones|Acute glomerulonephritis|Nephrotic syndrome|Urinary tract infection",2,"Heavy proteinuria with lipiduria defines the nephrotic picture.","المتلازمة الكلائية: بيلة بروتينية ودهنية");
Q("IMM","A woman in the first trimester has Toxoplasma IgG positive, IgM positive and high IgG avidity. The correct interpretation is","No evidence of infection at any time|Reinfection with a second Toxoplasma strain|Recent primary infection with high fetal risk|Infection acquired more than 4 months ago, so fetal risk is low",3,"High avidity excludes recent primary infection because avidity matures slowly.","الشراهة العالية تنفي العدوى الحديثة");
Q("IMM","A patient has HBsAg positive, anti-HBc IgM negative, anti-HBc total positive, HBeAg positive and raised ALT for 9 months. The interpretation is","Chronic hepatitis B with active replication|Acute hepatitis B acquired within recent weeks|Immunity following successful vaccination|Resolved infection with lasting immunity",0,"Persistence beyond 6 months with HBeAg indicates chronic replicative infection.","التهاب كبد B مزمن مع تكاثر نشط");
Q("HIS","A breast core biopsy is reported as invasive carcinoma with HER2 immunohistochemistry scored 2+. The required next step is","Report as HER2 negative|In situ hybridisation to assess gene amplification|Report as HER2 positive|Repeat immunohistochemistry only",1,"Equivocal protein expression must be resolved by FISH or dual ISH.","النتيجة 2+ تُحال إلى التهجين الموضعي");
Q("MGT","A potassium result of 6.9 mmol/L is obtained on a sample that the phlebotomist notes was difficult to draw and appears pink. The correct action is","Ignore this result altogether and report the previous value for the patient|Report it and telephone it as a critical value|Check the haemolysis index and request a fresh sample before reporting|Halve the reported value to allow for the haemolysis",2,"Haemolysis falsely raises potassium; reporting it could trigger harmful treatment.","الانحلال يرفع البوتاسيوم فتلزم عيّنة جديدة");
Q("MGT","Two consecutive control values fall 2.3 SD above the mean on the same level. The correct action is","Widen the control limits to three standard deviations and continue reporting results|Recalculate and reset the assigned mean of the control|Accept the run, treating the values as a warning only|Reject the run and investigate systematic error such as calibration or reagent lot",3,"The 2-2s rule is a rejection rule indicating bias.","خرق 2-2s يعني خطأ منهجيًّا ورفض الدفعة");
Q("MGT","A ward telephones for a result on a patient whose sample arrived in an unlabelled tube taken during a cardiac arrest. The best practice is","Do not report identifiable results; request a fresh labelled sample, escalating urgently|Label the tube yourself using the patient details written on the accompanying request form|Report the result with a written disclaimer attached|Run and report it because the patient is critically ill",0,"For an irretrievable specimen a documented re-identification by the collector is required before any exception.","الأنبوب غير الموسوم لا يُبلَّغ ويُطلب بديل عاجل");
Q("HEM","A patient with fever and confusion has platelets 15 x 10^9/L, schistocytes on the film, normal PT and aPTT, and renal impairment. The most likely diagnosis is","Disseminated intravascular coagulation|Thrombotic thrombocytopenic purpura|Immune thrombocytopenic purpura|Heparin-induced thrombocytopenia",1,"Normal coagulation screens with microangiopathy point to ADAMTS13 deficiency, not DIC.","TTP: اعتلال مجهري مع أزمنة تخثر طبيعية");
Q("CC","A patient with acute pancreatitis has a normal amylase on day 4 of admission. The best confirmatory test is","Amylase creatinine clearance ratio only|Repeat amylase|Serum lipase|Alkaline phosphatase",2,"Lipase stays raised for 8-14 days whereas amylase normalises in 3-5 days.","الليباز يبقى مرتفعًا أطول من الأميليز");
Q("CC","A patient taking high dose biotin supplements has a suppressed TSH with a high free T4 but is clinically euthyroid. The most likely explanation is","Heterophile antibody bridging the reagents|Hook effect from very high analyte levels|Genuine hyperthyroidism requiring treatment|Biotin interference in streptavidin-biotin immunoassays",3,"Repeat after stopping biotin for 48-72 hours or use a biotin-free platform.","البيوتين يشوّش مقايسات الستربتافيدين");
Q("MIC","A stool culture from a child with bloody diarrhoea and falling platelets and haemoglobin grows a sorbitol non-fermenting E. coli. The concern is","Shiga toxin production causing haemolytic uraemic syndrome|Cholera acquired from contaminated water|Enteric fever from Salmonella Typhi|Simple self-limiting viral gastroenteritis",0,"Antibiotics may increase toxin release and are generally avoided.","O157:H7 وذيفان شيغا يسبّبان المتلازمة الانحلالية اليوريميّة");
Q("BB","An emergency department requests blood for an unidentified trauma patient before any sample can be grouped. The correct issue is","Group AB positive red cells, since AB is the universal donor group for cells|Uncrossmatched group O red cells under an emergency release protocol|Withhold all blood until the grouping has been completed|Fresh frozen plasma alone until red cells are available",1,"Emergency release requires documented physician authorisation and later full testing.","الصرف الطارئ بكريات O دون توافق مع توثيق");
Q("HEM","A blood film from a patient with fever shows neutrophils with heavy toxic granulation, Dohle bodies and vacuoles, and the WBC is 22 x 10^9/L with a left shift. This picture indicates","An allergic reaction|A viral infection|A severe bacterial infection or sepsis|Chronic myeloid leukaemia",2,"These are reactive, not neoplastic, changes.","تغيّرات تفاعلية تدلّ على إنتان جرثومي شديد");
Q("UBF","A cerebrospinal fluid sample has 1200 cells per microlitre with 90% neutrophils, glucose 1.1 mmol/L against a blood glucose of 6.0 mmol/L, and protein 1.8 g/L. The most likely diagnosis is","Multiple sclerosis|A traumatic tap|Viral meningitis|Bacterial meningitis",3,"A CSF to blood glucose ratio well below 0.6 with neutrophilia is typical of bacterial infection.","سحايا جرثومي: عدلات وسكر منخفض وبروتين مرتفع");
Q("CC","A patient found unconscious has pH 7.15, anion gap 28 mmol/L, an osmolal gap of 35 mosm/kg and calcium oxalate crystals in the urine. The most likely poisoning is","Ethylene glycol|Paracetamol|Carbon monoxide|Salicylate",0,"Ethylene glycol metabolism produces oxalate and a wide osmolal gap.","الإيثيلين غلايكول يوسّع الفجوتين ويكوّن أوكسالات");
Q("MGT","A phlebotomist is asked to draw blood from an arm with an intravenous infusion of dextrose running. The correct action is","Draw from a site below the running cannula on the same arm without stopping the infusion first|Use the opposite arm, or a site distal to the infusion only if unavoidable and documented|Stop the infusion briefly and draw the sample immediately|Draw from a site above the running cannula on that arm",1,"Contamination with infusate grossly distorts glucose and electrolytes.","تُستخدم الذراع الأخرى عند وجود تسريب وريدي");
Q("MIC","A sputum sample for culture shows 40 squamous epithelial cells and 5 neutrophils per low power field. The laboratory should","Culture it and report whichever organisms are isolated|Culture it for fungi and mycobacteria only|Reject it as saliva and request a repeat specimen|Report it as showing normal respiratory flora",2,"Squamous cells indicate the sample is saliva, not lower respiratory secretions.","البلغم الغني بالخلايا الحرشفية يُرفض");
