<title>مِجهر Prometric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#F5F3F9; --surface:#FFFFFF; --surface2:#EFEBF7; --line:#DED7EE; --line2:#CBC2E2;
  --ink:#1B1626; --ink2:#5B5470; --ink3:#8C86A0;
  --violet:#4A32A8; --violet2:#6B52D0; --vsoft:#EBE5FA;
  --eosin:#C9436A; --esoft:#FBE7EE;
  --ok:#12805A; --oksoft:#DCF2E9;
  --bad:#B3312A; --badsoft:#FAE3E0;
  --warn:#A06A0B; --warnsoft:#FBEFD8;
  --shadow:0 1px 2px rgba(27,22,38,.05),0 10px 28px -16px rgba(27,22,38,.30);
  --r:14px; --rs:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131020; --surface:#1C182B; --surface2:#252036; --line:#332C48; --line2:#443A5F;
    --ink:#EDE9F7; --ink2:#ACA4C1; --ink3:#7C7595;
    --violet:#A48EF7; --violet2:#B9A8FA; --vsoft:#2A2246;
    --eosin:#EE7D9C; --esoft:#3A2029;
    --ok:#4ECB9B; --oksoft:#12332A;
    --bad:#F08579; --badsoft:#3A1F1D;
    --warn:#E0AB45; --warnsoft:#332715;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#131020; --surface:#1C182B; --surface2:#252036; --line:#332C48; --line2:#443A5F;
  --ink:#EDE9F7; --ink2:#ACA4C1; --ink3:#7C7595;
  --violet:#A48EF7; --violet2:#B9A8FA; --vsoft:#2A2246;
  --eosin:#EE7D9C; --esoft:#3A2029;
  --ok:#4ECB9B; --oksoft:#12332A;
  --bad:#F08579; --badsoft:#3A1F1D;
  --warn:#E0AB45; --warnsoft:#332715;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  direction:rtl; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0;text-wrap:balance;font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:600;line-height:1.35}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:"Reem Kufi",sans-serif;font-weight:700;font-size:19px}
.brand svg{flex:none}
.brand small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
.stain{height:3px;background:linear-gradient(90deg,var(--violet) 0%,var(--violet) 22%,var(--eosin) 22%,var(--eosin) 42%,var(--warn) 42%,var(--warn) 56%,var(--ok) 56%,var(--ok) 74%,var(--bad) 74%,var(--bad) 100%);opacity:.9}
.topsp{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface);transition:.15s}
.tbtn:hover{border-color:var(--line2);color:var(--ink)}
.timer{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;
  background:var(--vsoft);color:var(--violet);border:1px solid transparent}
.timer.low{background:var(--badsoft);color:var(--bad)}

.wrap{display:grid;grid-template-columns:216px minmax(0,1fr);gap:0;align-items:start;max-width:1240px;margin:0 auto}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:2px;padding:18px 12px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;
  font-size:14px;font-weight:500;color:var(--ink2);text-align:right;transition:.14s}
.rail button:hover{background:var(--surface2);color:var(--ink)}
.rail button.on{background:var(--violet);color:#fff;font-weight:600;box-shadow:var(--shadow)}
.rail button.on .badge{background:rgba(255,255,255,.24);color:#fff}
.rail .ico{width:18px;text-align:center;flex:none;opacity:.85}
.badge{margin-inline-start:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--ink2)}

main{padding:20px 22px 80px;min-width:0}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .rail{position:fixed;inset-inline:0;bottom:0;top:auto;flex-direction:row;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line);z-index:40;overflow-x:auto}
  .rail button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;border-radius:8px;text-align:center;min-width:60px}
  .rail button.on{box-shadow:none}
  .rail .ico{font-size:17px}
  .rail .badge{display:none}
  main{padding:16px 14px 92px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.eyebrow{font-size:12px;font-weight:700;color:var(--ink3);font-family:"IBM Plex Sans Arabic",sans-serif}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:10px;
  background:var(--violet);color:#fff;font-weight:600;font-size:14px;transition:.15s;border:1px solid transparent}
.btn:hover{background:var(--violet2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:7px 13px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--surface2);color:var(--ink2)}
.chip.v{background:var(--vsoft);color:var(--violet)}
.chip.g{background:var(--oksoft);color:var(--ok)}
.chip.r{background:var(--badsoft);color:var(--bad)}
.chip.y{background:var(--warnsoft);color:var(--warn)}
.sep{height:1px;background:var(--line);margin:4px 0}
.timer.plain{background:var(--surface2);color:var(--ink2)}
textarea{font:inherit;font-size:12px;line-height:1.5;width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);resize:vertical;direction:ltr;text-align:left}
select,input[type=number],input[type=search]{font:inherit;font-size:14px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
label.sw{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}
input[type=checkbox]{accent-color:var(--violet);width:16px;height:16px}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.kpi{background:var(--surface);padding:14px 16px}
.kpi b{display:block;font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;line-height:1.3}
.kpi span{font-size:11.5px;color:var(--ink3);font-weight:500}
.ring{--p:0;width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--violet) calc(var(--p)*1%),var(--surface2) 0)}
.ring i{width:80px;height:80px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-style:normal;font-weight:600;font-size:21px}

/* dipstick */
.strip{display:flex;flex-direction:column;gap:6px}
.dip{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:11px;cursor:pointer;
  padding:3px 4px;border-radius:8px;transition:.13s;border:none;width:100%;text-align:start;background:none;font:inherit}
.dip:hover{background:var(--surface2)}
.dip i{height:24px;border-radius:5px;border:1px solid rgba(0,0,0,.10);box-shadow:inset 0 -6px 10px -6px rgba(0,0,0,.28)}
.dip em{font-style:normal;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.dip s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3)}

/* ---------- question ---------- */
.qwrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .3s}
.stem{font-family:"IBM Plex Sans","Segoe UI",sans-serif;direction:ltr;text-align:left;
  font-size:17px;line-height:1.62;font-weight:500;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:11px;align-items:start;width:100%;
  padding:11px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);
  direction:ltr;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-size:15px;line-height:1.5;transition:.13s}
.opt:hover:not(:disabled){border-color:var(--violet);background:var(--vsoft)}
.opt k{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--surface2);
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink2)}
.opt.pick{border-color:var(--violet);background:var(--vsoft)}
.opt.pick k{background:var(--violet);color:#fff}
.opt.good{border-color:var(--ok);background:var(--oksoft)}
.opt.good k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.opt.wrong k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:11px;padding:13px 15px;border-inline-start:3px solid var(--violet);background:var(--surface2)}
.fb.good{border-color:var(--ok);background:var(--oksoft)}
.fb.bad{border-color:var(--bad);background:var(--badsoft)}
.fb .why{direction:ltr;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-size:14px;line-height:1.6}
.fb .ar{margin-top:5px;font-size:13.5px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .22s ease-out}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* navigator */
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.nav button{height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--ink2)}
.nav button.done{background:var(--vsoft);border-color:var(--violet);color:var(--violet)}
.nav button.flag{border-color:var(--warn);color:var(--warn)}
.nav button.cur{outline:2px solid var(--violet);outline-offset:1px}
.nav button.ok{background:var(--oksoft);border-color:var(--ok);color:var(--ok)}
.nav button.no{background:var(--badsoft);border-color:var(--bad);color:var(--bad)}

/* results */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13px}
.bar u{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{height:8px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.bar i b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px}
.bar s{text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:end;color:var(--ink2)}

/* bank list */
.qrow{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.qrow:last-child{border-bottom:none}
.qrow .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);flex:none;padding-top:2px;width:42px}
.qrow p{direction:ltr;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-size:14px;line-height:1.55}

/* guide */
.plan{display:grid;gap:10px}
.wk{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px dashed var(--line2)}
.wk:first-child{border-top:none}
.wk b{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--violet);font-weight:600}
.tips li{margin-bottom:7px}
.tips{padding-inline-start:20px;margin:0}
.empty{text-align:center;padding:46px 20px;color:var(--ink3)}
.empty h3{color:var(--ink2);margin-bottom:6px}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res th,table.res td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
table.res th{font-size:12px;color:var(--ink3);font-weight:700}
table.res td.num{font-family:"IBM Plex Mono",monospace;text-align:end}
.scroll{overflow-x:auto}
</style>

<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="9" r="5.2" stroke="var(--violet)" stroke-width="1.7"/>
      <circle cx="12" cy="9" r="1.9" fill="var(--eosin)"/>
      <path d="M6 20h12M12 14.2V20" stroke="var(--violet)" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    مِجهر <small>MLT · QATAR</small>
  </div>
  <div class="topsp"></div>
  <div id="topslot" class="row"></div>
  <button class="tbtn" id="themeBtn" title="تبديل السمة"><span id="themeIco">◐</span></button>
</header>
<div class="stain"></div>

<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main id="view"></main>
</div>

<script>
/* ================= QUESTION BANK ================= */
const B=[];let _n=0;
function Q(s,t,o,a,e,ar){B.push({id:++_n,s:s,t:t,o:o.split("|"),a:a,e:e,ar:ar});}
/* ---- Clinical Chemistry : 150 ---- */
Q("CC","Which cardiac marker is the most specific for myocardial injury?","Cardiac troponin I|Myoglobin|LDH|AST",0,"Troponin I/T is cardiac specific, rises in 3-6 h, peaks at 12-24 h and remains elevated 7-10 days.","التروبونين نوعي للقلب ويبقى مرتفعًا 7–10 أيام");
Q("CC","Which marker rises earliest after acute myocardial infarction?","Troponin T|Myoglobin|CK-MB|LDH-1",1,"Myoglobin rises within 1-3 h but lacks cardiac specificity, so it is used mainly for early rule-out.","الميوغلوبين أسرع ارتفاعًا لكنه غير نوعي");
Q("CC","CK-MB is most useful for detecting which event?","Pericarditis|Chronic heart failure|Re-infarction after an initial MI|Stable angina",2,"CK-MB returns to baseline in 48-72 h, so a second rise indicates re-infarction while troponin is still high.","CK-MB يعود سريعًا فيكشف الاحتشاء المتكرر");
Q("CC","The anion gap is calculated as","(Cl + HCO3) - Na|K + Na - Cl|Na - Cl|Na - (Cl + HCO3)",3,"Anion gap = Na - (Cl + HCO3); reference range 8-16 mmol/L.","فجوة الأنيونات = الصوديوم ناقص (الكلور + البيكربونات)");
Q("CC","A high anion gap metabolic acidosis is typically caused by","Diabetic ketoacidosis|Hyperaldosteronism|Diarrhoea|Renal tubular acidosis",0,"Ketoacids, lactate, methanol, ethylene glycol and salicylate all add unmeasured anions.","الحماض بفجوة عالية سببه كيتونات أو لاكتات أو سموم");
Q("CC","Sodium fluoride preserves glucose because it","Chelates calcium|Inhibits enolase|Activates hexokinase|Precipitates protein",1,"Fluoride blocks enolase in the glycolytic pathway, preventing the 5-7% per hour loss of glucose.","الفلورايد يثبّط إنزيم الإينوليز فيمنع التحلّل السكري");
Q("CC","The reference method for glucose measurement uses","Biuret|Diazo|Hexokinase|Jaffe reaction",2,"Hexokinase/G6PD coupled to NADPH is the reference method; glucose oxidase is the common routine method.","الهكسوكيناز هو الطريقة المرجعية للجلوكوز");
Q("CC","HbA1c reflects mean glycaemia over the preceding","6 months|2 weeks|4 weeks|8-12 weeks",3,"HbA1c mirrors the 120-day red cell lifespan, weighted toward the most recent 8-12 weeks.","الهيموغلوبين السكري يعكس 8–12 أسبوعًا");
Q("CC","HbA1c is falsely LOW in","Haemolytic anaemia|Uraemia|Iron deficiency anaemia|Splenectomy",0,"Shortened red cell survival reduces the time available for glycation.","انحلال الدم يقصّر عمر الكرية فيخفض HbA1c كاذبًا");
Q("CC","The diagnostic fasting plasma glucose threshold for diabetes mellitus is","5.6 mmol/L|7.0 mmol/L|11.1 mmol/L|4.0 mmol/L",1,"Fasting glucose 7.0 mmol/L (126 mg/dL) or above on two occasions is diagnostic.","سكر الصيام 7.0 ملمول/ل فأكثر تشخيصي");
Q("CC","In the 2-hour OGTT, diabetes is diagnosed at a plasma glucose of","7.0 mmol/L or above|7.8 mmol/L or above|11.1 mmol/L or above|10.0 mmol/L or above",2,"A 2-hour value of 11.1 mmol/L (200 mg/dL) or above confirms diabetes; 7.8-11.0 is impaired tolerance.","بعد ساعتين 11.1 فأكثر يعني السكري");
Q("CC","The Jaffe reaction measures creatinine using","Diazotised sulfanilic acid|Bromocresol green|Copper sulfate|Alkaline picrate",3,"Creatinine and alkaline picrate form an orange-red Janovski complex measured at 505 nm.","الجافيه: كرياتينين مع البكرات القلوي");
Q("CC","A known interferent in the Jaffe creatinine method is","Bilirubin and ketones|Chloride|Water|Sodium",0,"Non-creatinine chromogens such as ketones, bilirubin, glucose and cephalosporins interfere.","الكيتونات والبيليروبين تتداخل مع الجافيه");
Q("CC","Which analyte estimates GFR independently of muscle mass?","Serum creatinine|Cystatin C|Urea|Uric acid",1,"Cystatin C is produced at a constant rate by all nucleated cells and freely filtered.","سيستاتين C لا يتأثر بالكتلة العضلية");
Q("CC","A raised urea with a normal creatinine suggests","Rhabdomyolysis|Intrinsic renal failure|Pre-renal azotaemia or GI bleeding|Post-renal obstruction",2,"Dehydration and upper GI bleeding raise urea disproportionately (urea:creatinine ratio above 20:1).","اليوريا وحدها ترتفع في الجفاف والنزف الهضمي");
Q("CC","Which protein is measured by the biuret reaction?","Globulin only|Haemoglobin|Albumin only|Total protein",3,"Cupric ions in alkali bind peptide bonds giving a violet complex proportional to total protein.","البيوريت يقيس البروتين الكلي");
Q("CC","Albumin is most commonly measured with","Bromocresol green|Biuret|Jaffe|Diazo reagent",0,"Dye-binding with bromocresol green or purple is the routine albumin method.","البروموكريزول الأخضر لقياس الألبومين");
Q("CC","Serum protein electrophoresis of nephrotic syndrome typically shows","Monoclonal spike|Low albumin with raised alpha-2|Beta-gamma bridging|Absent alpha-1",1,"Albumin and small proteins are lost while large alpha-2 macroglobulin is retained.","المتلازمة الكلائية: ألبومين منخفض وألفا2 مرتفع");
Q("CC","Beta-gamma bridging on electrophoresis is characteristic of","Acute inflammation|Multiple myeloma|Hepatic cirrhosis|Nephrotic syndrome",2,"Polyclonal IgA increase in cirrhosis fills the gap between beta and gamma zones.","تشمّع الكبد يُظهر جسر بيتا-غاما");
Q("CC","A sharp monoclonal band in the gamma region suggests","Alpha-1 antitrypsin deficiency|Iron deficiency|Chronic infection|Multiple myeloma",3,"A narrow M-spike represents a single immunoglobulin clone.","القمة أحادية النسيلة تدل على المايلوما");
Q("CC","Alpha-1 antitrypsin deficiency is associated with","Emphysema and neonatal hepatitis|Renal stones|Haemochromatosis|Gout",0,"Loss of the main protease inhibitor allows elastase damage in lung and liver.","نقص ألفا1 أنتيتربسين يسبب النفاخ الرئوي");
Q("CC","Which enzyme is most elevated in acute pancreatitis within 24 hours?","ALT|Amylase|Alkaline phosphatase|GGT",1,"Amylase rises at 2-12 h and normalises in 3-5 days; lipase stays elevated longer and is more specific.","الأميليز يرتفع باكرًا في التهاب البنكرياس");
Q("CC","Which enzyme is more specific for pancreatic disease than amylase?","CK|ALP|Lipase|LDH",2,"Lipase is pancreas specific and remains raised 8-14 days.","الليباز أكثر نوعية وأطول بقاءً");

Q("HIS","Liquid-based cytology has the advantage of","Air drying|No fixation|Higher cost only|Reduced obscuring blood and mucus with the option of HPV testing on the same vial",3,"It also allows automated screening.","الخلايا السائلة تسمح بفحص HPV من العيّنة نفسها");
Q("HIS","An adequate cervical smear requires","Adequate squamous cellularity, with a transformation zone component preferred|Blood only|Endometrial cells|Any cells",0,"Absence of endocervical cells may prompt earlier repeat.","الكفاية تتطلّب خلايا حرشفية كافية");
Q("HIS","The Bethesda system category ASC-US means","Normal|Atypical squamous cells of undetermined significance|Definite cancer|Inadequate",1,"Reflex HPV testing usually guides management.","ASC-US خلايا حرشفية شاذّة غير محدّدة الدلالة");
Q("HIS","Koilocytosis on cervical cytology indicates","Trichomonas|Herpes|Human papillomavirus effect|Candida",2,"Perinuclear halos with nuclear atypia are characteristic.","التكهّف الخلوي أثر فيروس الورم الحليمي");
Q("HIS","Fine needle aspiration cytology is best suited for","Bone|Skin rashes|Deep abdominal masses only|Palpable superficial lesions such as thyroid, breast and lymph node",3,"It is rapid, cheap and minimally invasive.","الرشف بالإبرة الدقيقة للكتل السطحية");
Q("HIS","Cell block preparation from effusions is valuable because it","Allows sectioning, special stains and immunohistochemistry|Replaces smears|Needs no fixation|Reduces cost",0,"Architecture is better preserved than in smears.","الكتلة الخلوية تسمح بالصبغات والكيمياء المناعية");
Q("HIS","A serous effusion sample for cytology should be","Fixed in formalin|Sent fresh, refrigerated, with anticoagulant if needed|Frozen|Dried",1,"Prompt processing prevents degeneration.","سائل الانصباب يُرسل طازجًا مبرّدًا");
Q("HIS","Mesothelial cells in effusions are distinguished from adenocarcinoma by","Colour|Cell size only|Windows between cells, a two-tone cytoplasm and calretinin positivity|Nuclear size only",2,"Adenocarcinoma cells are typically BerEP4 and MOC-31 positive.","الخلايا المتوسطة تُظهر نوافذ وإيجابية الكالريتينين");
Q("HIS","Autolysis in tissue is prevented by","Freezing after 24 hours|Air drying|Delayed fixation|Prompt and adequate fixation",3,"Enzymatic self-digestion begins within minutes of devitalisation.","التثبيت السريع يمنع الانحلال الذاتي");
Q("HIS","Xylene is a hazardous reagent that requires","Use in a fume hood with appropriate personal protective equipment|Storage in an open container|Disposal down the sink|No precautions",0,"It is a neurotoxic and flammable solvent.","الزايلين يُستعمل في خزانة شفط مع واقيات");
Q("HIS","Formaldehyde exposure limits require","No monitoring|Monitoring of air concentration and use of ventilation|Annual checks only|Nothing if diluted",1,"It is a recognised carcinogen with strict occupational limits.","الفورمالدهيد يستوجب تهوية ومراقبة تعرّض");
Q("HIS","Specimen identification errors in histopathology are minimised by","Batch labelling|Single checks|Two-person verification, unique accession numbers and barcode tracking|Verbal confirmation only",2,"Misidentification is the most serious pre-analytical error.","الترقيم الفريد والباركود يمنعان الخلط");
Q("HIS","Gross description of a specimen must include","Patient name only|Time of surgery only|Only the diagnosis|Size, weight, colour, lesions, margins and the number of blocks taken",3,"It forms a permanent legal record.","الوصف العياني يشمل الأبعاد والحواف والقوالب");
Q("HIS","Surgical margins are best identified by","Inking the specimen before sectioning|Photographs only|The surgeon note only|Memory",0,"Different coloured inks orient the specimen.","تُحبَّر الحواف قبل التقطيع لتحديدها");
/* ---- Quality, Safety, Phlebotomy and Laboratory Management ---- */
Q("MGT","Accuracy is defined as","Reproducibility of repeated results|Closeness of a result to the true value|The smallest detectable amount|The test cost",1,"Precision is reproducibility; accuracy is trueness.","الصحّة قرب النتيجة من القيمة الحقيقية");
Q("MGT","Precision is best expressed by","The range only|The mean|The coefficient of variation|The median",2,"CV = (SD/mean) x 100 and allows comparison across concentrations.","الدقة تُعبَّر عنها بمعامل الاختلاف");
Q("MGT","A Levey-Jennings chart plots","Calibrators only|Reagent lots|Patient results against time|Control values against run or day with mean and SD limits",3,"It makes shifts and trends visible.","مخطط ليفي-جينينغز يرسم قيم الشواهد عبر الزمن");
Q("MGT","The Westgard rule 1-3s requires the analyst to","Reject the run|Warn only|Recalibrate without action|Accept the run",0,"A single control beyond 3 SD is a rejection rule.","قاعدة 1-3s قاعدة رفض");
Q("MGT","The Westgard rule 1-2s is","A rejection rule|A warning rule prompting inspection of other rules|An acceptance rule|Not used",1,"It triggers evaluation using the multirule scheme.","قاعدة 1-2s تحذيرية فقط");
Q("MGT","The 2-2s rule violation usually indicates","Nothing|Random error|Systematic error requiring calibration or reagent review|Sample error",2,"Two consecutive controls beyond the same 2 SD limit indicate bias.","خرق 2-2s يشير إلى خطأ منهجي");
Q("MGT","The R-4s rule detects","Carryover|Bias only|Systematic error|Random error or imprecision",3,"Controls on opposite sides spanning 4 SD indicate increased random error.","قاعدة R-4s تكشف الخطأ العشوائي");
Q("MGT","A trend on a Levey-Jennings chart most often indicates","Gradual deterioration such as reagent ageing or a failing lamp|Sample mix-up|Nothing|Sudden reagent change",0,"Six or more points moving in one direction define a trend.","الاتجاه يعني تدهورًا تدريجيًّا");
Q("MGT","A shift on a Levey-Jennings chart most often follows","A gradual change|An abrupt event such as a new reagent lot or recalibration|Random error|Operator fatigue",1,"Ten consecutive points on one side of the mean define a shift.","الانزياح يتبع حدثًا مفاجئًا كتغيير الدفعة");
Q("MGT","Internal quality control primarily assesses","Turnaround time|Comparison with other laboratories|Day-to-day precision and detection of analytical error|Staff competency",2,"External schemes assess accuracy against peers.","الضبط الداخلي يقيّم الدقة اليومية");
Q("MGT","External quality assessment (proficiency testing) is used to","Calibrate instruments|Train staff only|Replace internal QC|Compare laboratory performance against peers and reference values",3,"Participation is required for accreditation.","التقييم الخارجي يقارن الأداء بالمختبرات الأخرى");
Q("MGT","Proficiency testing samples must be","Treated exactly like patient samples by routine staff|Repeated many times|Analysed by the supervisor only|Sent to another laboratory for confirmation",0,"Referral or special handling is prohibited.","تُعامل عيّنات التقييم كعيّنات المرضى تمامًا");
Q("MGT","Total allowable error is","The same as the SD|The combination of bias and imprecision that still permits correct clinical interpretation|The maximum reagent cost|The instrument warranty",1,"TEa is used to set QC rules and judge performance.","الخطأ الكلي المسموح يجمع التحيّز واللادقّة");
Q("MGT","Sigma metrics are calculated as","bias/CV|CV/TEa|(TEa - bias)/CV|TEa x CV",2,"A sigma of 6 indicates world-class performance requiring minimal QC.","مقياس سيغما = (الخطأ المسموح ناقص التحيّز) ÷ معامل الاختلاف");
Q("MGT","Youden plot analysis in external quality schemes is used to","Measure turnaround|Track cost|Show random error only|Compare paired sample results and reveal systematic bias",3,"Points along the 45 degree line indicate consistent bias.","مخطط يودين يكشف التحيّز المنهجي");
Q("MGT","Control material should ideally be","Commutable and analysed at clinically relevant concentrations|Analysed once a month|The same as the calibrator|Prepared from patient pools only",0,"Using the calibrator as control does not detect calibration error.","المادة الضابطة تُحاكي العيّنات وتُقاس بمستويات مهمة");
Q("MGT","Using the calibrator as a control is unacceptable because it","Costs more|Cannot detect calibration errors|Is unstable|Is too concentrated",1,"Independent control material is required.","المعاير لا يصلح شاهدًا لأنه لا يكشف خطأ المعايرة");
Q("MGT","When a control fails, the FIRST action is to","Change the mean|Release results with a comment|Stop reporting, investigate the cause and correct it before releasing results|Repeat once and release regardless",2,"Patient results since the last acceptable QC must be evaluated.","عند فشل الشاهد يُوقف التبليغ ويُبحث السبب");
Q("MGT","Diagnostic sensitivity is calculated as","TN/(TN+FP)|TP/(TP+FP)|TN/(TN+FN)|TP/(TP+FN)",3,"It is the ability to correctly identify those with the disease.","الحساسية = الإيجابيات الحقيقية ÷ كل المرضى");
Q("MGT","Diagnostic specificity is calculated as","TN/(TN+FP)|TP/(TP+FP)|(TP+TN)/total|TP/(TP+FN)",0,"It is the ability to correctly identify those without disease.","النوعية = السلبيات الحقيقية ÷ كل الأصحاء");
Q("MGT","Positive predictive value depends strongly on","The test only|Disease prevalence in the population tested|The instrument|The operator",1,"PPV falls as prevalence falls, even for an excellent test.","القيمة التنبّؤية الإيجابية تعتمد على انتشار المرض");
Q("MGT","A screening test should ideally have","High cost|High specificity|High sensitivity to minimise missed cases|Low sensitivity",2,"Confirmatory tests then provide high specificity.","اختبار المسح يحتاج حساسية عالية");
Q("MGT","A receiver operating characteristic curve plots","Cost against time|Mean against SD|Bias against CV|Sensitivity against specificity as the cut-off varies",3,"The area under the curve summarises overall discrimination.","منحنى ROC يوازن الحساسية والنوعية");
Q("MGT","In method comparison, the regression slope reflects","Proportional (constant ratio) systematic error|Constant error|Precision|Random error",0,"The y-intercept reflects constant systematic error.","الميل يعكس الخطأ المنهجي النسبي");
Q("MGT","A Bland-Altman plot displays","Correlation only|The difference between two methods against their mean|Only the slope|Control values",1,"It shows bias and limits of agreement.","بلاند-ألتمان يعرض الفرق مقابل المتوسط");
Q("MGT","A high correlation coefficient between two methods","Measures accuracy|Proves agreement|Does not prove agreement because it is insensitive to bias|Measures precision",2,"Bias assessment requires difference plots and regression.","معامل الارتباط العالي لا يعني توافقًا");
Q("MGT","Linearity studies determine","Sensitivity only|Cost|Precision|The measuring range over which results are proportional to concentration",3,"Results outside the linear range require dilution.","دراسة الخطية تحدّد مدى القياس");
Q("MGT","Carryover studies assess","Contamination of one sample by the previous high sample|Operator skill|Storage|Reagent stability",0,"A high sample is followed by low samples to measure the effect.","دراسة الانتقال تقيس تلوّث العيّنة بسابقتها");
Q("MGT","A reference interval established by a laboratory should be verified with a minimum of about","5 subjects|20 healthy reference subjects|100 subjects|1000 subjects",1,"Full establishment requires 120 or more subjects.","التحقّق من المجال المرجعي بـ20 شخصًا سليمًا على الأقل");
Q("MGT","Reference intervals should be reviewed when","The supervisor changes|Never|The method, population or instrument changes|Only annually by law",2,"Continuity of clinical interpretation depends on it.","تُراجع المجالات عند تغيّر الطريقة أو السكان");
Q("MGT","Verification of a new method before clinical use must include","Only precision|Only cost analysis|Nothing if CE marked|Precision, accuracy, reportable range and reference interval verification",3,"Documented verification is an accreditation requirement.","التحقّق يشمل الدقة والصحّة والمدى والمجال المرجعي");
Q("MGT","Calibration verification is performed","At defined intervals, after major maintenance and when QC indicates drift|Weekly always|Never|Only at installation",0,"Manufacturer instructions and regulations define the frequency.","تُتحقّق المعايرة دوريًّا وبعد الصيانة الكبرى");
Q("MGT","The pre-analytical phase accounts for approximately","5% of laboratory errors|60-70% of laboratory errors|1%|20%",1,"Collection, identification and transport dominate error statistics.","معظم أخطاء المختبر في المرحلة قبل التحليلية");
Q("MGT","The most serious pre-analytical error is","Lipaemia|Slight haemolysis|Patient or specimen misidentification|Delayed transport",2,"It can lead directly to patient harm, especially in transfusion.","الخطأ في هوية المريض هو الأخطر");
Q("MGT","Patient identification before phlebotomy requires","The room number|The requesting doctor name|One identifier|At least two independent identifiers such as full name and date of birth or medical record number",3,"Bed and room numbers are never acceptable identifiers.","التعريف بمُعرِّفَين مستقلَّين على الأقل");
Q("MGT","For an unconscious patient without identification, the laboratory should","Use the assigned unique emergency identification number consistently|Use the bed number|Use a nickname|Refuse all testing",0,"The temporary number must be linked to the permanent record later.","يُستخدم رقم طوارئ فريد ثابت");
Q("MGT","The correct order of draw begins with","EDTA tube|Blood culture bottles|Serum tube|Citrate tube",1,"Sterility must be protected before any additive tube.","يبدأ ترتيب السحب بقنينة زرع الدم");
Q("MGT","In the order of draw, the citrate (light blue) tube is collected","After EDTA|Before blood cultures|Immediately after blood cultures and before serum and heparin tubes|Last",2,"Additive carryover would alter coagulation results.","السترات بعد زرع الدم وقبل بقية الأنابيب");
Q("MGT","In the order of draw, the EDTA tube is collected","Before citrate|Before serum|First|After heparin tubes and before fluoride tubes",3,"EDTA carryover falsely raises potassium and lowers calcium.","EDTA بعد الهيبارين وقبل الفلورايد");
Q("MGT","The last tube in the order of draw is usually","Sodium fluoride/potassium oxalate (grey)|Citrate|Serum|EDTA",0,"Fluoride inhibits enzymes and would interfere with other tests.","الأنبوب الرمادي هو الأخير");
Q("MGT","A tourniquet should not remain applied for more than","10 seconds|1 minute|5 minutes|10 minutes",1,"Prolonged stasis causes haemoconcentration and falsely raises many analytes.","لا يبقى الرباط أكثر من دقيقة");
Q("MGT","The preferred venepuncture site is the","Dorsal hand veins|Basilic vein|Median cubital vein|Cephalic vein at the wrist",2,"It is well anchored and away from the brachial artery and median nerve.","الوريد المتوسط المرفقي هو المفضّل");
Q("MGT","Venepuncture should be avoided","In the antecubital fossa|In adults|On the opposite arm to a mastectomy|On the same side as a mastectomy, fistula or an infusion line",3,"Lymphoedema and infusion contamination compromise the sample and the patient.","يُتجنّب الذراع ذات الناسور أو استئصال الثدي");
Q("MGT","Vigorous mixing or shaking of a blood tube causes","Haemolysis|Faster clotting|No effect|Better mixing",0,"Tubes are inverted gently 5-10 times.","الرجّ العنيف يسبّب انحلالًا");
Q("MGT","The most common cause of haemolysis during collection is","A large gauge needle|Using a small needle, excessive suction or forcing blood through the needle into a tube|Slow filling|Gentle inversion",1,"Transferring blood through the needle should be avoided.","الإبرة الرفيعة والشفط القوي يسبّبان الانحلال");
Q("MGT","Fainting (syncope) during phlebotomy is managed by","Leaving the patient alone|Continuing the draw|Removing the tourniquet and needle, lowering the head and ensuring the patient is safe|Giving water immediately while unconscious",2,"The patient must never be left unattended.","عند الإغماء تُسحب الإبرة ويُخفض الرأس");
Q("MGT","A haematoma forming during venepuncture requires","Adding a second tourniquet|Massaging the site|Continuing the draw|Immediate removal of the needle and firm pressure",3,"Pressure is applied for at least 2-5 minutes.","الورم الدموي يستوجب سحب الإبرة والضغط");
Q("MGT","Nerve injury during venepuncture is suspected when the patient reports","Sharp shooting pain, tingling or numbness, requiring immediate needle removal|Warmth|Nothing|Mild pressure",0,"The event must be documented and reported.","الألم الكهربائي يوجب سحب الإبرة فورًا");
Q("MGT","Capillary (skin puncture) blood differs from venous blood by having","Lower glucose|Higher glucose and lower potassium, calcium and total protein|Identical values|Higher potassium",1,"Composition resembles arterial blood more than venous.","دم الوخز أعلى غلوكوزًا وأقلّ بوتاسيومًا");
Q("MGT","In infants the recommended heel stick site is","The big toe|The centre of the heel|The medial or lateral plantar surface of the heel|The arch",2,"The central heel risks calcaneal bone injury.","الوخز في الحافة الوحشية أو الإنسية للعقب");
Q("MGT","The first drop of a capillary sample should be","Used for glucose only|Placed on a slide|Collected for testing|Wiped away because it contains tissue fluid",3,"Tissue fluid dilutes the sample.","تُمسح القطرة الأولى لاحتوائها سائلًا نسيجيًّا");
Q("MGT","Excessive squeezing (milking) of a finger during capillary collection causes","Tissue fluid contamination, haemolysis and falsely low potassium and platelet counts|No change|Higher accuracy|Better flow only",0,"Gentle intermittent pressure is used instead.","العصر الشديد يلوّث العيّنة بالسائل النسيجي");
Q("MGT","Needles must be disposed of","After recapping with two hands|Immediately into a puncture-resistant sharps container without recapping|In the general waste|After bending",1,"Recapping is the leading cause of needlestick injury.","تُلقى الإبر في حاوية الحادّة دون إعادة تغطية");
Q("MGT","A sharps container should be replaced when it is","Overflowing|Completely full|About three quarters full|Half full only after a month",2,"Overfilling causes injuries during disposal.","تُستبدل الحاوية عند ثلاثة أرباع امتلائها");
Q("MGT","The first action after a needlestick injury is","Squeeze the wound vigorously|Apply bleach|Report to the supervisor|Wash the site immediately with soap and running water",3,"Reporting, source evaluation and post-exposure prophylaxis follow immediately.","اغسل الموضع فورًا بالماء والصابون ثم أبلغ");
Q("MGT","Post-exposure prophylaxis for HIV is most effective when started","Within 72 hours, ideally within hours of exposure|After 1 week|After seroconversion|Only if symptoms occur",0,"Rapid initiation markedly reduces transmission risk.","الوقاية بعد التعرّض تبدأ خلال ساعات");
Q("MGT","Hepatitis B vaccination for laboratory staff is","Optional|Strongly recommended or mandatory, with anti-HBs titre confirmation|Only for phlebotomists|Only after exposure",1,"An anti-HBs level above 10 mIU/mL indicates protection.","تطعيم التهاب الكبد B مع التأكّد من العيار");
Q("MGT","Standard precautions require that","Handwashing is optional|Only known infectious samples are treated as hazardous|All blood and body fluids are treated as potentially infectious|Gloves are optional",2,"Universal application removes reliance on knowing the diagnosis.","تُعامل كل العيّنات على أنها معدية");
Q("MGT","Gloves should be changed","Only when visibly soiled|Every hour regardless|Once per shift|Between patients and whenever contaminated or torn",3,"Hand hygiene is performed after removal.","تُبدَّل القفازات بين المرضى وعند التلوّث");
Q("MGT","Eating, drinking and applying cosmetics in the laboratory are","Prohibited in all technical areas|Allowed if careful|Allowed in the corner|Allowed at the bench",0,"They are permitted only in designated clean areas.","يُمنع الأكل والشرب في مناطق العمل");
Q("MGT","Centrifuging an unbalanced load may cause","Better separation|Rotor damage, aerosol release and mechanical failure|Faster spinning|Nothing",1,"Tubes must be balanced by weight and placed symmetrically.","عدم الاتزان يُتلف الطرد ويطلق الرذاذ");
Q("MGT","A centrifuge lid should be opened","At any time|Immediately after switching off|Only after the rotor has come to a complete stop, waiting 30 seconds for aerosols to settle|While spinning slowly",2,"Aerosols are a major laboratory infection route.","لا يُفتح الغطاء قبل التوقف التام");
Q("MGT","Mouth pipetting is","Allowed with care|Allowed for non-infectious samples|Acceptable for water|Absolutely prohibited",3,"Mechanical pipetting devices must always be used.","يُمنع السحب بالفم منعًا باتًّا");
Q("MGT","A Class II biosafety cabinet must be certified","At installation, after relocation or repair, and at least annually|Every 5 years|Only when it fails|Never",0,"Airflow and HEPA integrity are verified.","تُعتمد الخزانة سنويًّا وبعد النقل والإصلاح");
Q("MGT","A chemical safety data sheet must be","Filed in the office only|Readily accessible to all staff for every hazardous chemical|Requested from the supplier when needed|Reviewed yearly by management only",1,"It lists hazards, handling, storage and first aid.","صحيفة بيانات السلامة متاحة لكل العاملين");
Q("MGT","When diluting concentrated acid the correct practice is","Heat first|Add water to acid|Add acid slowly to water with stirring|Mix equal volumes rapidly",2,"The reverse generates violent, spattering heat.","يُضاف الحمض إلى الماء لا العكس");
Q("MGT","Flammable solvents must be stored in","Refrigerators for food|Open shelves|Ordinary cupboards|An approved, vented flammable storage cabinet away from ignition sources",3,"Domestic refrigerators are a common ignition hazard.","تُخزَّن المذيبات في خزانة معتمدة للمواد القابلة للاشتعال");
Q("MGT","A fire caused by electrical equipment should be extinguished with","A carbon dioxide or dry powder extinguisher|Foam|Sand only|Water",0,"Water conducts electricity and increases the hazard.","حريق الكهرباء يُطفأ بثاني أكسيد الكربون أو المسحوق");
Q("MGT","The RACE acronym in fire response stands for","Run, Alert, Call, Escape|Rescue, Alarm, Contain, Extinguish or Evacuate|Report, Assess, Clean, Exit|Read, Act, Control, End",1,"PASS describes extinguisher use: pull, aim, squeeze, sweep.","RACE: إنقاذ، إنذار، احتواء، إطفاء أو إخلاء");
Q("MGT","A blood spill should be managed by","Ignoring small spills|Wiping with a dry cloth|Covering with absorbent material, applying 0.5% hypochlorite, then removing with gloves and disposing as clinical waste|Rinsing with water",2,"Contact time of at least 10 minutes is required.","يُغطّى الانسكاب ويُطهَّر بالهيبوكلوريت");
Q("MGT","Infectious clinical waste is usually disposed of in","Ordinary bins|The sink|Black bags|Yellow or red bags for incineration or autoclaving",3,"Colour coding follows national regulations.","النفايات المعدية في أكياس صفراء أو حمراء");
Q("MGT","Cultures and stocks of microorganisms must be","Decontaminated by autoclaving or an approved method before disposal|Rinsed with water|Stored indefinitely|Discarded directly",0,"Autoclave performance must be validated with indicators.","تُعقَّم المزارع قبل التخلّص منها");
Q("MGT","An eyewash station must be","Tested annually|Accessible within 10 seconds of hazard areas and flushed regularly|Locked|Located outside the building",1,"Flushing prevents biofilm and confirms function.","محطّة غسل العين قريبة وتُشغَّل دوريًّا");
Q("MGT","Ergonomic injury among laboratory staff is most often related to","Cold|Chemical exposure|Repetitive pipetting and prolonged microscopy posture|Noise",2,"Job rotation, adjustable seating and electronic pipettes reduce risk.","الإصابات المهنية من تكرار المصّ والجلوس الطويل");
Q("MGT","Laboratory results may be released to","Family members freely|The employer routinely|Anyone who asks|Only the authorised requesting clinician, the patient or a legally authorised person",3,"Confidentiality is a legal and ethical obligation.","النتائج تُصرف للمخوّلين قانونًا فقط");
Q("MGT","Patient confidentiality in the laboratory requires","Restricted access to records, secure passwords and discretion in all communication|Publishing results|Sharing with colleagues freely|Discussing cases in corridors",0,"Breaches carry legal and professional consequences.","السرّية تستوجب حماية السجلات والحذر في الحديث");
Q("MGT","Informed consent is particularly required for","All routine tests|Tests with major personal implications such as HIV and genetic testing, per local law|No tests|Only surgery",1,"Pre-test counselling accompanies such tests.","الموافقة المستنيرة لفحوص كالإيدز والوراثة");
Q("MGT","A laboratory information system audit trail records","Nothing|Only final results|Who entered, modified or released each result and when|Reagent lots only",2,"Amended reports must retain the original value.","سجل التدقيق يوثّق كل تعديل ومَن أجراه");
Q("MGT","When a released result is found to be wrong, the laboratory should","Wait for the next sample|Ignore it|Delete it silently|Issue a corrected report, retain the original and notify the clinician promptly",3,"Prompt notification limits patient harm.","يُصدَر تقرير مصحّح ويُبلَّغ الطبيب فورًا");
Q("MGT","Turnaround time is measured from","Specimen collection or receipt to result release, as defined by policy|Reagent order to delivery|Shift start to end|Result release to reporting",0,"Critical tests have defined maximum turnaround targets.","زمن الاستجابة يُقاس من السحب أو الاستلام حتى الإصدار");
Q("MGT","A specimen rejection policy should be","Informal|Written, with defined criteria and documented communication to the requester|Decided case by case|Unnecessary",1,"Irretrievable specimens may be tested with a disclaimer.","سياسة الرفض مكتوبة وتُبلَّغ للجهة الطالبة");
Q("MGT","Which specimen must be rejected outright?","A gel tube|Slightly lipaemic serum|An unlabelled tube or one with a mismatched label|A fasting sample",2,"Identification errors cannot be corrected retrospectively.","الأنبوب غير الموسوم يُرفض حتمًا");
Q("MGT","Documents in a quality management system must be","Handwritten only|Kept by one person|Uncontrolled|Version controlled, authorised, dated and reviewed periodically",3,"Obsolete copies must be withdrawn from use.","الوثائق مضبوطة بالإصدار ومراجعة دوريًّا");
Q("MGT","A standard operating procedure should be reviewed","At defined intervals and whenever the method or equipment changes|Every 10 years|Never|Only when it fails",0,"Staff must be retrained on significant changes.","تُراجع الإجراءات دوريًّا وعند أي تغيير");
Q("MGT","A non-conformity in the quality system requires","Immediate blame|Root cause analysis, corrective action and verification of effectiveness|Ignoring if minor|A verbal note only",1,"Preventive action addresses potential problems.","عدم المطابقة يستوجب تحليل الجذر وإجراءً تصحيحيًّا");
Q("MGT","An internal audit in an accredited laboratory is performed","Never|By an external body only|Periodically by trained internal staff independent of the area audited|By the head only",2,"Findings feed into management review.","التدقيق الداخلي يُجرى بموظفين مستقلّين عن القسم");
Q("MGT","The international standard specifically for medical laboratory quality and competence is","ISO 14001|ISO 27001|ISO 9001|ISO 15189",3,"It covers both management and technical requirements.","الأيزو 15189 خاص بالمختبرات الطبية");
Q("MGT","Staff competency assessment must be","Performed initially and at defined intervals with documented evidence|Assumed after 5 years|Optional|Performed once at hiring",0,"Direct observation, record review and blind testing are common methods.","تُقيَّم الكفاءة أوّليًّا ودوريًّا بتوثيق");
Q("MGT","Equipment maintenance records must include","Purchase price only|Preventive maintenance, repairs, calibration and function checks with dates|Operator names only|Nothing",1,"Records demonstrate fitness for use.","سجلات الصيانة توثّق الوقاية والإصلاح والمعايرة");
Q("MGT","Reagents must be used","Only in emergencies|Beyond the expiry date if they look fine|Within the expiry date and after documented lot verification|Without checking lots",2,"New lots are verified against the current lot before use.","تُستخدم الكواشف ضمن صلاحيتها بعد التحقّق من الدفعة");
Q("MGT","Refrigerator and freezer temperatures for reagents must be","Checked yearly|Not monitored|Checked monthly|Monitored and recorded daily with defined action limits",3,"Out-of-range events require documented action.","تُسجَّل حرارة الثلاجات يوميًّا");
Q("MGT","Water quality for the laboratory should be monitored for","Resistivity, microbial content and total organic carbon as appropriate|Taste|Temperature|Colour only",0,"Poor water quality causes unexplained analytical drift.","تُراقب جودة الماء بالمقاومية والمحتوى الجرثومي");
Q("MGT","A biohazard symbol must be displayed on","Only culture plates|Laboratory doors, equipment, refrigerators and transport containers holding infectious material|Nothing|Office doors",1,"It warns all who enter or handle the material.","علامة الخطر البيولوجي على الأبواب والأجهزة والحاويات");
Q("MGT","Infectious specimens transported outside the facility must use","Ordinary post|A single container|Triple packaging with a leak-proof primary receptacle, absorbent secondary packaging and rigid outer packaging|A paper envelope",2,"Category A and B substances have specific regulatory requirements.","النقل بتغليف ثلاثي وفق اللوائح");
Q("MGT","In molecular diagnostics, the workflow must be unidirectional to prevent","Sample confusion only|Equipment damage|Reagent waste|Amplicon carryover contamination",3,"Separate rooms for reagent preparation, template addition and amplification are used.","سير العمل باتجاه واحد يمنع تلوّث النواتج المضخّمة");
Q("MGT","An internal amplification control in PCR is used to detect","Inhibition and assay failure in an individual sample|Reagent cost|Operator error only|Contamination",0,"Its absence signals an invalid result rather than a true negative.","الشاهد الداخلي يكشف تثبيط التفاعل");
Q("MGT","A no-template control in PCR detects","Inhibition|Reagent or environmental contamination|Sensitivity|Specificity of primers only",1,"Any amplification in the NTC invalidates the run.","شاهد بلا قالب يكشف التلوّث");
Q("MGT","The purpose of a laboratory risk assessment is to","Satisfy auditors only|Assign blame|Identify hazards, evaluate risk and implement controls before harm occurs|Increase workload",2,"It must be documented and reviewed regularly.","تقييم المخاطر يحدّد الأخطار ويضبطها مسبقًا");
Q("MGT","The most effective single measure to prevent laboratory-acquired infection is","Antibiotics|Annual training only|Vaccination only|Consistent adherence to standard precautions including hand hygiene and correct PPE",3,"Engineering controls and safe practices reinforce it.","الالتزام بالاحتياطات القياسية أفعل وقاية");

Q("CC","A 58-year-old man arrives 5 hours after the onset of crushing chest pain. Troponin I is markedly raised and CK-MB is high. Two days later the pain recurs. Which marker best confirms re-infarction?","CK-MB, which had returned toward baseline|LDH|Myoglobin measured on admission|Troponin I, which is still elevated",0,"Troponin remains high for 7-10 days and cannot distinguish a second event; CK-MB normalises by 48-72 h so a new rise is informative.","التروبونين ما يزال مرتفعًا فلا يميّز الاحتشاء الثاني");
Q("CC","A 22-year-old with type 1 diabetes is admitted drowsy. Glucose 28 mmol/L, pH 7.10, bicarbonate 8 mmol/L, urine ketones trace only. What explains the weak urine ketone result?","The patient is not ketotic|The dipstick does not detect beta-hydroxybutyrate, the dominant ketone in severe acidosis|The urine is too dilute|Ascorbic acid interference only",1,"Measure blood beta-hydroxybutyrate; nitroprusside detects only acetoacetate and acetone.","الشريط لا يكشف بيتا هيدروكسي بيوتيرات السائد في الحماض");
Q("CC","A 60-year-old on a thiazide has sodium 118 mmol/L, serum osmolality 245 mosm/kg, urine osmolality 600 mosm/kg and is clinically euvolaemic. The most likely diagnosis is","Pseudohyponatraemia|Dehydration|Syndrome of inappropriate ADH secretion|Diabetes insipidus",2,"Concentrated urine despite low serum osmolality with euvolaemia is the classic SIADH pattern.","بول مركّز مع أسمولالية منخفضة وسواء حجم يعني SIADH");
Q("CC","A serum sample from a patient with triglycerides of 40 mmol/L reports sodium 118 mmol/L on an indirect ISE analyser, yet the patient is asymptomatic. The next step is","Repeat the same method|Report as critical|Treat the hyponatraemia|Repeat by direct ISE on whole blood",3,"Severe lipaemia causes pseudohyponatraemia only on diluted (indirect) methods.","الشحوم العالية تسبّب نقص صوديوم كاذبًا على الطريقة غير المباشرة");
Q("CC","A 35-year-old woman has calcium 2.90 mmol/L, phosphate 0.65 mmol/L and PTH at the upper limit of normal. The most likely diagnosis is","Primary hyperparathyroidism|Vitamin D deficiency|Hypoparathyroidism|Secondary hyperparathyroidism",0,"A non-suppressed PTH in the face of hypercalcaemia is inappropriate and indicates autonomy.","PTH غير مكبوت مع فرط كالسيوم يعني فرط جارات أوّليًّا");
Q("CC","A 45-year-old with fatigue has TSH 8.5 mIU/L and free T4 within the reference interval. This pattern is","Overt hypothyroidism|Subclinical hypothyroidism|Hyperthyroidism|A pituitary tumour",1,"Anti-TPO antibodies help predict progression to overt disease.","قصور درقي تحت سريري: TSH مرتفع وT4 طبيعي");
Q("CC","A patient on long-term phenytoin has a total phenytoin level below the therapeutic range but albumin of 22 g/L and clinically adequate seizure control. The best action is","Repeat the total level|Increase the dose|Measure free phenytoin|Stop the drug",2,"Hypoalbuminaemia lowers the total but not the free, pharmacologically active fraction.","نقص الألبومين يخفض المستوى الكلي لا الحر");
Q("CC","A 3-day-old term infant has total bilirubin 300 micromol/L, almost entirely unconjugated, with a positive DAT and maternal group O, infant group A. The mechanism is","Gilbert syndrome|Neonatal hepatitis|Biliary atresia|ABO haemolytic disease of the newborn",3,"Maternal IgG anti-A crosses the placenta; the disease is usually mild but can require phototherapy.","مرض ABO الانحلالي الوليدي بأضداد الأم IgG");
Q("HEM","A 30-year-old woman has Hb 9.5 g/dL, MCV 68 fL, RDW 18%, RBC 4.0 x 10^12/L and ferritin 6 microgram/L. The diagnosis is","Iron deficiency anaemia|Anaemia of chronic disease|Sideroblastic anaemia|Beta thalassaemia trait",0,"Low ferritin with a high RDW and a low red cell count fits iron deficiency; the Mentzer index of 17 also favours it.","فريتين منخفض وRDW مرتفع يعني عوز حديد");
Q("HEM","A 26-year-old has Hb 10.8 g/dL, MCV 63 fL, RBC 6.2 x 10^12/L, RDW 13% and normal ferritin. The next test is","Iron therapy trial|Haemoglobin electrophoresis or HPLC for HbA2|Bone marrow aspirate|Reticulocyte count only",1,"A high red cell count with a normal RDW and normal iron suggests thalassaemia trait; HbA2 above 3.5% confirms beta trait.","عدد كريات مرتفع مع RDW طبيعي يوجّه للثلاسيميا");
Q("HEM","A patient on heparin for 6 days develops a platelet fall from 250 to 60 x 10^9/L and a new deep vein thrombosis. The most likely diagnosis is","Pseudothrombocytopenia|Immune thrombocytopenic purpura|Heparin-induced thrombocytopenia|Disseminated intravascular coagulation",2,"Anti-PF4/heparin antibodies cause thrombocytopenia with paradoxical thrombosis; heparin must be stopped.","نقص الصفيحات بالهيبارين مع خثار متناقض");
Q("HEM","An automated platelet count is 45 x 10^9/L but the patient has no bleeding and the film shows platelet aggregates at the feather edge. The correct action is","Transfuse platelets|Report as critical immediately|Report the low count|Repeat the count on a citrate or heparin sample",3,"EDTA-dependent pseudothrombocytopenia must be excluded before reporting.","تكتّل الصفيحات في EDTA يستوجب إعادة بأنبوب سترات");
Q("HEM","A patient with sepsis has platelets 40 x 10^9/L, PT and aPTT prolonged, fibrinogen 0.8 g/L and D-dimer markedly raised. The diagnosis is","Disseminated intravascular coagulation|Vitamin K deficiency|Liver disease alone|Haemophilia A",0,"Consumption of platelets and factors with secondary fibrinolysis defines DIC.","استهلاك العوامل والصفيحات مع D-dimer مرتفع يعني DIC");
Q("HEM","A prolonged aPTT fully corrects on 1:1 mixing with normal plasma and the patient has a lifelong history of joint bleeds. The next test is","Lupus anticoagulant assay|Factor VIII and IX assays|Platelet aggregation|D-dimer",1,"Correction on mixing indicates a factor deficiency rather than an inhibitor.","التصحيح بالخلط يوجّه لمعايرة العوامل");
Q("HEM","A 68-year-old has WBC 180 x 10^9/L with the full spectrum of granulocyte maturation, 3% blasts, basophilia and massive splenomegaly. The most likely diagnosis is","Chronic lymphocytic leukaemia|Leukaemoid reaction|Chronic myeloid leukaemia|Acute myeloid leukaemia",2,"BCR-ABL1 testing confirms it; the LAP score is characteristically low.","ابيضاض النقي المزمن مع كثرة أسسات وضخامة طحال");
Q("BB","A patient receiving red cells develops fever, loin pain and red urine after 50 mL. The FIRST laboratory action after the transfusion is stopped is","Culture the unit|Issue a new unit|Repeat the antibody panel|Perform a clerical check, inspect post-transfusion plasma for haemolysis, and repeat ABO and DAT",3,"These three steps detect most acute ABO incompatibility within minutes.","التحقّق الكتابي وفحص البلازما وكومبس أولًا");
Q("BB","A patient transfused 8 days ago has a falling haemoglobin, jaundice and a newly positive DAT with mixed-field agglutination. The most likely antibody class involved is","An anamnestic IgG alloantibody such as anti-Jka|Anti-A|Anti-Lewis|A cold IgM autoantibody",0,"Kidd antibodies fall below detection between exposures and cause delayed reactions.","تفاعل انحلالي متأخر بضدّ IgG استذكاري");
Q("BB","A group A Rh negative woman delivers a group O Rh positive infant. The Kleihauer test suggests a 45 mL fetal bleed. The RhIG dose required is","One standard 300 microgram dose|Two standard doses|No dose is needed|Half a dose",1,"Each 300 microgram dose covers 30 mL of whole blood, so a 45 mL bleed needs two.","نزف 45 مل يحتاج جرعتين من الأنتي-D");
Q("BB","During crossmatching, the patient serum is incompatible with all six units tested and the autocontrol is also positive. The most likely explanation is","Technical error only|A single alloantibody|A warm autoantibody|Anti-K",2,"Autoadsorption or differential adsorption is needed to exclude underlying alloantibodies.","ضدّ ذاتي دافئ يفسّر عدم التوافق العام");
Q("MIC","A 24-year-old woman has dysuria; urine culture grows 80,000 CFU/mL of a catalase positive, coagulase negative, novobiocin resistant gram positive coccus. The organism is","Enterococcus faecalis|Streptococcus agalactiae|Staphylococcus epidermidis|Staphylococcus saprophyticus",3,"It is a leading cause of cystitis in sexually active young women.","المكوّرة الرمّية مقاومة للنوفوبيوسين وتسبّب التهاب المثانة");
Q("MIC","A diabetic patient in ketoacidosis develops black necrotic nasal turbinates. Tissue microscopy shows broad, ribbon-like, aseptate hyphae. The diagnosis is","Mucormycosis|Candidiasis|Cryptococcosis|Aspergillosis",0,"Rhino-orbital-cerebral mucormycosis needs urgent debridement and amphotericin B.","الفطار العفني: خيوط عريضة غير مقسّمة");
Q("MIC","A ventilated patient grows an oxidase positive, non-lactose fermenting gram negative rod producing a green pigment and a grape-like odour. The organism is","Escherichia coli|Pseudomonas aeruginosa|Klebsiella pneumoniae|Acinetobacter baumannii",1,"Intrinsic resistance makes susceptibility testing essential before therapy.","الزائفة الزنجارية موجبة الأوكسيداز وخضراء الصباغ");
Q("MIC","A child with a sore throat grows beta-haemolytic colonies that are bacitracin sensitive and PYR positive. Which complication is this organism associated with?","Botulism|Guillain-Barre syndrome|Acute rheumatic fever and post-streptococcal glomerulonephritis|Haemolytic uraemic syndrome",2,"Group A streptococcal sequelae are immune mediated; ASO titres support recent infection.","العقدية المقيّحة تسبّب الحمى الرثوية والتهاب الكبيبات");
Q("MIC","Blood cultures from a patient with a prosthetic hip grow coagulase negative staphylococci in one bottle of one set only. The most appropriate interpretation is","Sterile|Contaminated media|Definite bacteraemia|Probable skin contamination, but repeat cultures are needed given the prosthesis",3,"Significance depends on the number of positive sets and the clinical context.","نموّ في قنينة واحدة يوحي بالتلوّث مع ضرورة الإعادة");
Q("PAR","A traveller returning from West Africa has fever, and the thin film shows multiple ring forms per red cell with 8% parasitaemia and crescentic gametocytes. The species and severity are","Plasmodium falciparum, severe|Plasmodium malariae, mild|Plasmodium ovale, mild|Plasmodium vivax, mild",0,"High parasitaemia, multiple rings and banana gametocytes indicate severe falciparum malaria.","المنجلية الشديدة: طفيلية عالية وأمشاج موزيّة");
Q("UBF","A patient with acute renal failure has urine showing muddy brown granular casts and renal tubular epithelial cells. The most likely diagnosis is","Glomerulonephritis|Acute tubular necrosis|Cystitis|Nephrotic syndrome",1,"Red cell casts would indicate a glomerular cause instead.","القوالب الحبيبية البنية تدل على نخر نبيبي حاد");
Q("UBF","A 6-year-old has periorbital oedema, urine protein 4+, and oval fat bodies showing a Maltese cross under polarised light. The diagnosis is","Renal stones|Acute glomerulonephritis|Nephrotic syndrome|Urinary tract infection",2,"Heavy proteinuria with lipiduria defines the nephrotic picture.","المتلازمة الكلائية: بيلة بروتينية ودهنية");
Q("IMM","A woman in the first trimester has Toxoplasma IgG positive, IgM positive and high IgG avidity. The correct interpretation is","No infection|Reinfection|Recent primary infection|Infection acquired more than 4 months ago, so fetal risk is low",3,"High avidity excludes recent primary infection because avidity matures slowly.","الشراهة العالية تنفي العدوى الحديثة");
Q("IMM","A patient has HBsAg positive, anti-HBc IgM negative, anti-HBc total positive, HBeAg positive and raised ALT for 9 months. The interpretation is","Chronic hepatitis B with active replication|Resolved infection|Vaccine response|Acute hepatitis B",0,"Persistence beyond 6 months with HBeAg indicates chronic replicative infection.","التهاب كبد B مزمن مع تكاثر نشط");
Q("HIS","A breast core biopsy is reported as invasive carcinoma with HER2 immunohistochemistry scored 2+. The required next step is","Report as HER2 negative|In situ hybridisation to assess gene amplification|Report as HER2 positive|Repeat immunohistochemistry only",1,"Equivocal protein expression must be resolved by FISH or dual ISH.","النتيجة 2+ تُحال إلى التهجين الموضعي");
Q("MGT","A potassium result of 6.9 mmol/L is obtained on a sample that the phlebotomist notes was difficult to draw and appears pink. The correct action is","Ignore the result|Report and telephone the critical value|Check the haemolysis index and request a fresh sample before reporting|Halve the result",2,"Haemolysis falsely raises potassium; reporting it could trigger harmful treatment.","الانحلال يرفع البوتاسيوم فتلزم عيّنة جديدة");
Q("MGT","Two consecutive control values fall 2.3 SD above the mean on the same level. The correct action is","Widen the control limits|Change the control mean|Accept the run as a warning only|Reject the run and investigate systematic error such as calibration or reagent lot",3,"The 2-2s rule is a rejection rule indicating bias.","خرق 2-2s يعني خطأ منهجيًّا ورفض الدفعة");
Q("MGT","A ward telephones for a result on a patient whose sample arrived in an unlabelled tube taken during a cardiac arrest. The best practice is","Do not report identifiable results; request a fresh labelled sample, escalating urgently|Label it yourself from the request form|Report with a disclaimer|Run and report it because the patient is critical",0,"For an irretrievable specimen a documented re-identification by the collector is required before any exception.","الأنبوب غير الموسوم لا يُبلَّغ ويُطلب بديل عاجل");
Q("HEM","A patient with fever and confusion has platelets 15 x 10^9/L, schistocytes on the film, normal PT and aPTT, and renal impairment. The most likely diagnosis is","Disseminated intravascular coagulation|Thrombotic thrombocytopenic purpura|Immune thrombocytopenic purpura|Heparin-induced thrombocytopenia",1,"Normal coagulation screens with microangiopathy point to ADAMTS13 deficiency, not DIC.","TTP: اعتلال مجهري مع أزمنة تخثر طبيعية");
Q("CC","A patient with acute pancreatitis has a normal amylase on day 4 of admission. The best confirmatory test is","Amylase creatinine clearance ratio only|Repeat amylase|Serum lipase|Alkaline phosphatase",2,"Lipase stays raised for 8-14 days whereas amylase normalises in 3-5 days.","الليباز يبقى مرتفعًا أطول من الأميليز");
Q("CC","A patient taking high dose biotin supplements has a suppressed TSH with a high free T4 but is clinically euthyroid. The most likely explanation is","Heterophile antibodies|Hook effect|True hyperthyroidism|Biotin interference in streptavidin-biotin immunoassays",3,"Repeat after stopping biotin for 48-72 hours or use a biotin-free platform.","البيوتين يشوّش مقايسات الستربتافيدين");
Q("MIC","A stool culture from a child with bloody diarrhoea and falling platelets and haemoglobin grows a sorbitol non-fermenting E. coli. The concern is","Shiga toxin production causing haemolytic uraemic syndrome|Cholera|Typhoid|Simple gastroenteritis",0,"Antibiotics may increase toxin release and are generally avoided.","O157:H7 وذيفان شيغا يسبّبان المتلازمة الانحلالية اليوريميّة");
Q("BB","An emergency department requests blood for an unidentified trauma patient before any sample can be grouped. The correct issue is","Group AB positive red cells|Uncrossmatched group O red cells under an emergency release protocol|No blood until grouping|Fresh frozen plasma only",1,"Emergency release requires documented physician authorisation and later full testing.","الصرف الطارئ بكريات O دون توافق مع توثيق");
Q("HEM","A blood film from a patient with fever shows neutrophils with heavy toxic granulation, Dohle bodies and vacuoles, and the WBC is 22 x 10^9/L with a left shift. This picture indicates","An allergic reaction|A viral infection|A severe bacterial infection or sepsis|Chronic myeloid leukaemia",2,"These are reactive, not neoplastic, changes.","تغيّرات تفاعلية تدلّ على إنتان جرثومي شديد");
Q("UBF","A cerebrospinal fluid sample has 1200 cells per microlitre with 90% neutrophils, glucose 1.1 mmol/L against a blood glucose of 6.0 mmol/L, and protein 1.8 g/L. The most likely diagnosis is","Multiple sclerosis|A traumatic tap|Viral meningitis|Bacterial meningitis",3,"A CSF to blood glucose ratio well below 0.6 with neutrophilia is typical of bacterial infection.","سحايا جرثومي: عدلات وسكر منخفض وبروتين مرتفع");
Q("CC","A patient found unconscious has pH 7.15, anion gap 28 mmol/L, an osmolal gap of 35 mosm/kg and calcium oxalate crystals in the urine. The most likely poisoning is","Ethylene glycol|Paracetamol|Carbon monoxide|Salicylate",0,"Ethylene glycol metabolism produces oxalate and a wide osmolal gap.","الإيثيلين غلايكول يوسّع الفجوتين ويكوّن أوكسالات");
Q("MGT","A phlebotomist is asked to draw blood from an arm with an intravenous infusion of dextrose running. The correct action is","Draw below the cannula|Use the opposite arm, or a site distal to the infusion only if unavoidable and documented|Stop the drip and draw immediately|Draw above the cannula",1,"Contamination with infusate grossly distorts glucose and electrolytes.","تُستخدم الذراع الأخرى عند وجود تسريب وريدي");
Q("MIC","A sputum sample for culture shows 40 squamous epithelial cells and 5 neutrophils per low power field. The laboratory should","Report as normal flora|Culture and report it|Reject it as saliva and request a repeat specimen|Culture only for fungi",2,"Squamous cells indicate the sample is saliva, not lower respiratory secretions.","البلغم الغني بالخلايا الحرشفية يُرفض");
Q("IMM","A patient with recurrent Neisseria meningitidis infections has a normal immunoglobulin profile. The most useful investigation is","CD4 count|ANA|IgE level|CH50 to assess the terminal complement pathway",3,"C5-C9 deficiency impairs membrane attack complex formation.","تكرار عدوى النيسرية يوجّه لنقص المتمّمة النهائية");
Q("HIS","A frozen section is requested during breast surgery to assess a margin, but the tissue is fatty and produces poor sections. The correct response is","Explain the limitation and defer to paraffin sections|Force thicker sections|Refuse the request|Report as negative",0,"Adipose tissue freezes poorly; over-interpretation risks a wrong surgical decision.","النسيج الدهني رديء التجميد فيُؤجَّل للبارافين");
Q("HEM","A haematocrit of 45% with a red cell count of 5.0 x 10^12/L gives an MCV of","45 fL|90 fL|100 fL|9 fL",1,"MCV = (Hct% x 10)/RBC = (45 x 10)/5 = 90 fL.","MCV = (45 × 10) ÷ 5 = 90 فمتولتر");
Q("HEM","Haemoglobin 12 g/dL with a haematocrit of 36% gives an MCHC of","3.3 g/dL|30 g/dL|33.3 g/dL|36 g/dL",2,"MCHC = (Hb x 100)/Hct = 1200/36 = 33.3 g/dL.","MCHC = (12 × 100) ÷ 36 = 33.3");
Q("HEM","Haemoglobin 12 g/dL with a red cell count of 4.0 x 10^12/L gives an MCH of","33 pg|48 pg|24 pg|30 pg",3,"MCH = (Hb x 10)/RBC = 120/4 = 30 pg.","MCH = (12 × 10) ÷ 4 = 30 بيكوغرام");
Q("HEM","A reticulocyte count of 9% in a patient with a haematocrit of 15% corrects to","3%|1.5%|18%|9%",0,"Corrected retic = 9 x (15/45) = 3%.","التصحيح: 9 × (15 ÷ 45) = 3%");
Q("HEM","A WBC count of 20 x 10^9/L with 50 nucleated red cells per 100 white cells corrects to","10 x 10^9/L|13.3 x 10^9/L|20 x 10^9/L|30 x 10^9/L",1,"Corrected WBC = (20 x 100)/(100 + 50) = 13.3 x 10^9/L.","التصحيح = (20 × 100) ÷ 150 = 13.3");
Q("HEM","A WBC of 8.0 x 10^9/L with 20% neutrophils and 5% bands gives an absolute neutrophil count of","8.0 x 10^9/L|1.6 x 10^9/L|2.0 x 10^9/L|0.4 x 10^9/L",2,"ANC = 8.0 x (20 + 5)/100 = 2.0 x 10^9/L.","العدد المطلق = 8 × 25% = 2.0");
Q("HEM","A patient has a haematocrit of 60% and needs coagulation testing. Compared with the standard, the citrate volume must be","Unchanged|Doubled|Increased|Reduced",3,"Less plasma per tube means relatively excess citrate, which falsely prolongs the clotting times.","الهيماتوكريت العالي يستوجب إنقاص السترات");
Q("CC","A creatinine of 2.0 mg/dL is approximately how many micromol/L?","177|44|20|88",0,"Multiply mg/dL by 88.4: 2.0 x 88.4 = 177 micromol/L.","2 × 88.4 ≈ 177 ميكرومول/ل");
Q("CC","A glucose of 180 mg/dL equals approximately","5.0 mmol/L|10.0 mmol/L|18.0 mmol/L|3.2 mmol/L",1,"Divide mg/dL by 18: 180/18 = 10 mmol/L.","180 ÷ 18 = 10 ملمول/ل");
Q("CC","Sodium 140, chloride 100 and bicarbonate 24 mmol/L give an anion gap of","40|10|16|24",2,"140 - (100 + 24) = 16 mmol/L, at the upper limit of normal.","140 − 124 = 16");

Q("CC","A measured osmolality of 320 with a calculated value of 292 mosm/kg gives an osmolal gap of","28|48|8|12",0,"320 - 292 = 28, which is well above the normal limit of about 10.","320 − 292 = 28 وهي فجوة واسعة");

/* ================= APP ================= */
const SEC={
  CC:{ar:"الكيمياء السريرية",en:"Clinical Chemistry"},
  HEM:{ar:"أمراض الدم",en:"Haematology"},
  BB:{ar:"بنك الدم",en:"Blood Bank"},
  MIC:{ar:"الأحياء الدقيقة",en:"Microbiology"},
  PAR:{ar:"الطفيليات",en:"Parasitology"},
  MYV:{ar:"الفطريات والفيروسات",en:"Mycology & Virology"},
  IMM:{ar:"المناعة والمصليات",en:"Immunology"},
  UBF:{ar:"البول وسوائل الجسم",en:"Urinalysis & Fluids"},
  HIS:{ar:"الأنسجة والخلايا",en:"Histopathology"},
  MGT:{ar:"الجودة والسلامة",en:"Quality & Safety"}
};
const KEYS=Object.keys(SEC);
const LS="mijhar.mlt.v2";
const PASS=60;
const TOTAL=B.length;
const DAY=86400000;
const IV=[0,1,3,7,16,35];

let S={st:{},fl:{},ex:[],ses:null,theme:null};
try{const r=localStorage.getItem(LS);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
try{ // migrate v1 progress if present
  if(!Object.keys(S.st).length){const o=localStorage.getItem("mijhar.mlt.v1");
    if(o){const v=JSON.parse(o);S.st=v.st||{};S.fl=v.fl||{};S.ex=v.ex||[];}}
}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}

/* ---- theme ---- */
function applyTheme(){
  if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
  else document.documentElement.removeAttribute("data-theme");
  document.getElementById("themeIco").textContent=S.theme==="dark"?"☾":S.theme==="light"?"☀":"◐";
}
document.getElementById("themeBtn").onclick=function(){
  S.theme=S.theme==="dark"?"light":S.theme==="light"?null:"dark";save();applyTheme();
};
applyTheme();

/* ---- helpers ---- */
const $=function(s){return document.querySelector(s)};
const esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
const byId={};B.forEach(function(q){byId[q.id]=q});
function rec(id){return S.st[id]||{c:0,w:0,l:null,lv:0,due:0}}
function secList(s){return B.filter(function(q){return q.s===s})}
function stats(list){
  let seen=0,ok=0,att=0,cor=0;
  list.forEach(function(q){const r=S.st[q.id];if(r){seen++;att+=r.c+r.w;cor+=r.c;if(r.l===1)ok++;}});
  return {n:list.length,seen:seen,ok:ok,att:att,cor:cor,acc:att?Math.round(cor/att*100):0,cov:Math.round(seen/list.length*100)};
}
function allStats(){return stats(B)}
function wrongIds(){return B.filter(function(q){return rec(q.id).l===0}).map(function(q){return q.id})}
function flagIds(){return B.filter(function(q){return S.fl[q.id]}).map(function(q){return q.id})}
function dueIds(){const now=Date.now();return B.filter(function(q){const r=S.st[q.id];return r&&(r.due||0)<=now}).map(function(q){return q.id})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a}
function fmt(ms){const t=Math.max(0,Math.floor(ms/1000));const m=Math.floor(t/60),s=t%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s}
function padColor(st){
  if(!st.seen)return "var(--line2)";
  const a=st.acc;
  if(a<50)return "#C24034";
  if(a<65)return "#D4802A";
  if(a<80)return "#B8A72E";
  if(a<90)return "#5D9E3D";
  return "#1E8A5A";
}
/* spaced repetition */
function grade(id,ok){
  const r=S.st[id]||{c:0,w:0,l:null,lv:0,due:0};
  if(ok){r.c++;r.l=1;r.lv=Math.min((r.lv||0)+1,IV.length-1);}
  else{r.w++;r.l=0;r.lv=0;}
  r.due=Date.now()+IV[r.lv]*DAY;
  S.st[id]=r;
}

/* ---- session ---- */
let ses=S.ses||null,tick=null;

function startSession(mode,ids,limitMin){
  if(!ids||!ids.length){alert("لا توجد أسئلة مطابقة لهذا الاختيار.");return;}
  ses={mode:mode,ids:ids,i:0,ans:{},ord:{},done:false,review:false,start:Date.now(),limit:limitMin?limitMin*60000:0};
  ids.forEach(function(id){
    const q=byId[id];const o=q.o.map(function(_,k){return k});
    ses.ord[id]=shuffle(o);
  });
  S.ses=ses;save();
  startTick();
  go(mode==="exam"?"exam":"practice");
}
function startTick(){
  if(tick)clearInterval(tick);
  if(ses&&!ses.done)tick=setInterval(timerTick,1000);
}
function timerTick(){
  if(!ses||ses.done){clearInterval(tick);return;}
  const el=$("#timer");if(!el)return;
  if(ses.limit){
    const left=ses.limit-(Date.now()-ses.start);
    el.textContent=fmt(left);el.className="timer mono"+(left<300000?" low":"");
    if(left<=0){clearInterval(tick);finishExam();}
  }else{
    el.textContent=fmt(Date.now()-ses.start);
  }
}
function answer(id,pick){
  if(ses.ans[id]!==undefined)return;
  ses.ans[id]=pick;
  if(ses.mode==="practice")grade(id,pick===byId[id].a);
  save();render();
}
function finishExam(){
  ses.done=true;if(tick)clearInterval(tick);
  let cor=0;const bySec={};
  ses.ids.forEach(function(id){
    const q=byId[id];const p=ses.ans[id];const ok=p===q.a;
    if(!bySec[q.s])bySec[q.s]={n:0,c:0};
    bySec[q.s].n++;if(ok){bySec[q.s].c++;cor++;}
    grade(id,ok);
  });
  S.ex.unshift({d:Date.now(),n:ses.ids.length,c:cor,s:bySec,t:Date.now()-ses.start});
  S.ex=S.ex.slice(0,20);save();render();
}
function endSession(){ses=null;S.ses=null;save();if(tick)clearInterval(tick);}

/* ---- routing ---- */
let view="dash",sub="wrong",bankQ="",bankSec="ALL",bkMsg="";
const NAV=[
  {k:"dash",ic:"◍",t:"الرئيسية"},
  {k:"practice",ic:"✎",t:"تدريب"},
  {k:"exam",ic:"⏱",t:"امتحان"},
  {k:"review",ic:"↺",t:"مراجعتي"},
  {k:"bank",ic:"☰",t:"البنك"},
  {k:"guide",ic:"✦",t:"المرشد"}
];
function go(v){
  if((v==="practice"||v==="exam")&&ses&&ses.mode!==v){if(!ses.done)if(!confirm("لديك جلسة جارية. الخروج منها سينهيها. متابعة؟"))return;endSession();}

function nextStep(){
  const a=allStats();const w=wrongIds().length;const d=dueIds().length;
  if(a.seen===0)return {txt:"ابدأ بجلسة تدريب قصيرة من عشرين سؤالًا مختلطًا. سأقيس بها مستواك في الأقسام العشرة قبل أن أرسم لك خطة.",btn:'<button class="btn" data-go="practice">ابدأ أول جلسة</button>'};
  if(d>=20)return {txt:"لديك "+d+" سؤالًا حان موعد مراجعتها. المراجعة في وقتها أرخص كثيرًا من إعادة التعلّم من الصفر.",btn:'<button class="btn" data-drill="due">راجع المستحقّة الآن</button>'};
  if(w>=15)return {txt:"لديك "+w+" سؤالًا أخطأت فيها. راجعها قبل أن تفتح مادة جديدة؛ تصحيح الخطأ أسرع مكسبٍ للدرجة.",btn:'<button class="btn" data-drill="wrong">راجع أخطائي</button>'};
  const weak=KEYS.map(function(k){return {k:k,st:stats(secList(k))}})
    .filter(function(x){return x.st.att>=5}).sort(function(x,y){return x.st.acc-y.st.acc})[0];
  if(weak&&weak.st.acc<PASS)return {txt:"أضعف أقسامك الآن هو "+SEC[weak.k].ar+" بدقّة "+weak.st.acc+"%. خصّص له جلسة مركّزة من ثلاثين سؤالًا.",btn:'<button class="btn" data-sec-go="'+weak.k+'">تدرّب على '+SEC[weak.k].ar+'</button>'};
  if(a.cov<40)return {txt:"تغطيتك للبنك "+a.cov+"% فقط. وسّع المدى بجلسات مختلطة قبل التركيز على الامتحانات الكاملة.",btn:'<button class="btn" data-go="practice">جلسة مختلطة</button>'};
  return {txt:"أداؤك مستقرّ عند "+a.acc+"%. اختبر ثباتك تحت ضغط الوقت بامتحان محاكٍ من مئة سؤال في ساعتين.",btn:'<button class="btn" data-go="exam">امتحان محاكٍ</button>'};
}
